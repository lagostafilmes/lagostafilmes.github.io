<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagosta Filmes</title>

<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#A5C7F9">

<style>
:root{
  --bg:#A5C7F9;--box:#fff;--line:#000;--shadow:rgba(0,0,0,.4);
  --fm-red:#7a0000;--fm-green:#00e060;--fm-black:#111;
  --mono:"Courier New",monospace;
}
body{
  margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;
  display:flex;justify-content:center;
}
main{
  max-width:720px;width:100%;padding:16px;
  display:grid;row-gap:24px;
}
.box{
  background:var(--box);border:1px solid var(--line);
  box-shadow:2px 2px 0 var(--shadow);padding:12px;
}
header{text-align:center}
header img{max-width:180px;margin-bottom:12px}
.poster img{width:100%;border:1px solid #000}

.fm-header{
  display:flex;justify-content:space-between;
  font-weight:bold;color:var(--fm-red);
}
.player{
  margin-top:10px;font-family:var(--mono);font-size:12px;
}
.player button{
  width:100%;background:var(--fm-red);color:#fff;border:0;
  padding:8px;cursor:pointer;
}
.progress{
  height:6px;background:#d00;border:1px solid #000;margin:6px 0;
}
.progress span{
  display:block;height:100%;background:#fff;width:0%;
}
.time{
  display:flex;justify-content:space-between;font-size:11px;
}

.chat{
  margin-top:12px;background:var(--fm-black);color:var(--fm-green);
  font-family:var(--mono);font-size:11px;padding:8px;
}
.chat-log{
  max-height:90px;overflow:auto;border:1px solid var(--fm-green);
  padding:6px;background:#000;
}
.chat input{
  width:100%;margin-top:6px;background:#000;color:var(--fm-green);
  border:1px solid var(--fm-green);padding:6px;
}
.chat button{
  width:100%;margin-top:6px;background:var(--fm-green);
  border:0;padding:6px;font-family:var(--mono);cursor:pointer;
}
.old{opacity:.85}

footer{text-align:center;font-family:var(--mono);font-size:12px}
</style>
</head>

<body>
<main>

<!-- BANNER (INALTERADO) -->
<header class="box">
  <img src="logo-lagosta-filmes.png" alt="Lagosta Filmes">
  <div class="poster">
    <img src="poster-fortown.png" alt="Em breve">
  </div>
</header>

<!-- EPISÓDIO PILOTO 02 (POST NOVO) -->
<section class="box fm-block" data-ep="ep02"
  data-audio="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-02.mp3?alt=media">
  <div class="fm-header">
    <span>LAGOSTA FM</span><span>ON AIR</span>
  </div>

  <strong>EPISÓDIO PILOTO 02</strong>

  <div class="player">
    <button>PLAY</button>
    <div class="progress"><span></span></div>
    <div class="time"><span>00:00</span><span>--:--</span></div>
    <audio></audio>
  </div>

  <div class="chat">
    <div class="chat-log"></div>
    <input placeholder="digite sua mensagem">
    <button>ENVIAR</button>
  </div>
</section>

<!-- EPISÓDIO PILOTO 01 (POST ANTIGO) -->
<section class="box fm-block old" data-ep="ep01"
  data-audio="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-piloto.mp3?alt=media">
  <div class="fm-header">
    <span>LAGOSTA FM</span><span>ARQUIVO</span>
  </div>

  <strong>EPISÓDIO PILOTO</strong>

  <div class="player">
    <button>PLAY</button>
    <div class="progress"><span></span></div>
    <div class="time"><span>00:00</span><span>--:--</span></div>
    <audio></audio>
  </div>

  <div class="chat">
    <div class="chat-log"></div>
    <input placeholder="digite sua mensagem">
    <button>ENVIAR</button>
  </div>
</section>

<footer class="box">
  oi@lagostafilmes.com<br>
  insta: @lagosta.filmes
</footer>

</main>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyD4tr7eZNSvs3z49ROibvM48mjEZLCImZo",
  databaseURL: "https://lagosta-fm-default-rtdb.firebaseio.com"
});
const db = firebase.database();

document.querySelectorAll(".fm-block").forEach(block=>{
  const ep = block.dataset.ep;
  const audio = block.querySelector("audio");
  audio.src = block.dataset.audio;

  const btn = block.querySelector(".player button");
  const bar = block.querySelector(".progress span");
  const tCur = block.querySelector(".time span:first-child");
  const tTot = block.querySelector(".time span:last-child");

  btn.onclick = ()=>{
    if(audio.paused){audio.play();btn.textContent="PAUSE";}
    else{audio.pause();btn.textContent="PLAY";}
  };

  audio.onloadedmetadata = ()=>{
    tTot.textContent = format(audio.duration);
  };
  audio.ontimeupdate = ()=>{
    tCur.textContent = format(audio.currentTime);
    bar.style.width = (audio.currentTime/audio.duration*100)+"%";
  };

  const log = block.querySelector(".chat-log");
  const input = block.querySelector(".chat input");
  const send = block.querySelector(".chat button");

  db.ref("messages/"+ep).on("value",snap=>{
    log.innerHTML="";
    Object.values(snap.val()||{}).forEach(m=>{
      log.innerHTML += `<div>[${m.time}] ${m.text}</div>`;
    });
    log.scrollTop = 9999;
  });

  send.onclick = ()=>{
    if(!input.value.trim())return;
    db.ref("messages/"+ep).push({
      text: input.value,
      time: new Date().toLocaleTimeString()
    });
    input.value="";
  };
});
