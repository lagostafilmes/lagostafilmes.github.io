<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lagosta Filmes</title>
<meta name="description" content="Lagosta Filmes. Fortown!, em breve. Lagosta FM, no ar. Comentários.">

<!-- Favicon Lagosta Filmes -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#A5C7F9">

<style>
/* Layout: uma página branca de 660px sobre o azul-céu, como um fotolog de 2005 —
   o nome com o status (no ar, ouvindo), a foto do dia (uma tira de super 16), a legenda,
   e os comentários dos amigos, "fulano diz:". Tahoma 11px, links azuis, regras cinza. */
:root{
  --ceu:#A5C7F9;       /* o fundo */
  --branco:#FDEBC6;    /* a página: creme claro */
  --moldura:#D9B468;   /* a borda da página */
  --texto:#1C1C1C;
  --cinza:#7A6A4A;     /* datas, legendas */
  --regra:#E9D3A3;     /* as linhas */
  --link:#1F4FBF;
  --vermelho:#D23B2C;  /* o vermelho do logo */
  --online:#3DB54A;    /* o verdinho de "online" */
  --campo:#B59A5E;     /* borda de campo de texto */
  --faixa:#FBD899;     /* o creme do logo (o mesmo do avatar do insta): cabeçalho e status */
  --fonte:Tahoma,Verdana,"Segoe UI","DejaVu Sans",sans-serif;
}

*{box-sizing:border-box}
html{background:var(--ceu)}
body{
  margin:0;
  background:var(--ceu);
  color:var(--texto);
  font:11px/1.55 var(--fonte);
  padding-block:26px 30px;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
}
img{max-width:100%}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:1px dotted var(--texto);outline-offset:2px}

/* ---------- a página ---------- */
.pagina{
  max-width:660px;
  margin:0 auto;
  background:var(--branco);
  border:1px solid var(--moldura);
}

/* o nome */
.cabeca{
  background:var(--faixa);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  padding:14px 16px 10px;
}
.cabeca .marca{display:block;width:104px;line-height:0}
.cabeca .marca img{width:100%;height:auto;display:block}
.cabeca .lugar{color:var(--cinza);padding-bottom:2px}

/* o status: no ar, ouvindo */
.status{
  background:var(--faixa);
  border-top:1px solid rgba(0,0,0,.08);
  border-bottom:1px solid var(--regra);
  padding:7px 16px 8px;
}
.status-linha{
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  align-items:baseline;
}
.no-ar{white-space:nowrap}
.no-ar::before{
  content:"";
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--online);
  border:1px solid #2E8F3A;
  margin-right:5px;
  vertical-align:-1px;
}
.ouvindo{color:var(--texto)}
.ouvindo .nota{color:var(--cinza);margin-right:3px}
.controles{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}
.botao{
  flex:none;
  font:11px/1 var(--fonte);
  color:var(--texto);
  background:linear-gradient(#FDFDFD,#E3E3E3);
  border:1px solid #7A7A7A;
  border-radius:3px;
  padding:4px 10px;
  min-width:52px;
  cursor:pointer;
}
.botao:hover{background:linear-gradient(#FFFFFF,#EDEDED)}
.botao:active{background:#DCDCDC}
.barra{
  flex:1;
  min-width:0;
  position:relative;
  height:12px;
  background:#FFFDF7;
  border:1px solid var(--campo);
  cursor:pointer;
}
.progress-bar-fill{height:100%;width:0%;background:var(--vermelho)}
.comment-marker{
  position:absolute;
  top:-1px;
  width:3px;
  height:12px;
  background:var(--link);
  cursor:pointer;
}
.comment-marker:hover{background:var(--online)}
.marker-bubble{
  position:absolute;
  left:0;
  bottom:16px;
  background:#FFFFE1;
  color:var(--texto);
  border:1px solid #000;
  font:10px/1.3 var(--fonte);
  padding:2px 5px;
  white-space:nowrap;
  display:none;
  pointer-events:none;
  max-width:240px;
  overflow:hidden;
  text-overflow:ellipsis;
  z-index:10;
}
.tempos{
  flex:none;
  font-size:10px;
  color:var(--cinza);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
audio{display:none}

/* ---------- a foto do dia ---------- */
.foto{padding:16px 16px 0}
.imagem{
  display:block;
  width:100%;
  height:auto;
  border:1px solid #CDB27A;
}
.legenda{padding:8px 16px 14px}
.legenda-linha{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.legenda-linha b{font-size:12px}
.legenda-linha .data{color:var(--cinza);white-space:nowrap}
.legenda p{margin:2px 0 0}
.legenda .meta{color:var(--cinza);margin-top:4px}

/* ---------- os comentários ---------- */
.comentarios{
  border-top:1px solid var(--regra);
  padding:10px 16px 14px;
}
.comentarios-cab{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.comentarios-cab b{font-size:12px}
.comentarios-cab .quantos{color:var(--cinza)}
.chat-log{margin-top:6px}
.diz{
  padding:7px 0;
  border-top:1px solid var(--regra);
}
.diz:first-child{border-top:0}
.diz-cab{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.diz-cab .nick{font-weight:bold}
.diz-cab .hora{color:var(--cinza);font-size:10px;white-space:nowrap}
.diz-txt{padding-left:10px;overflow-wrap:anywhere}
.diz-txt .at-time{font-size:10px;color:var(--link);margin-left:5px;cursor:pointer}
.chat-vazio{color:var(--cinza);padding:6px 0}
.chat-envio{
  display:flex;
  gap:6px;
  margin-top:8px;
  padding-top:10px;
  border-top:1px solid var(--regra);
}
.msg-field{
  flex:1;
  min-width:0;
  font:11px/1.4 var(--fonte);
  color:var(--texto);
  background:#FFFDF7;
  border:1px solid var(--campo);
  border-radius:0;
  padding:3px 4px;
}
.msg-field:focus{outline:1px solid var(--link);outline-offset:-1px}
.msg-field.nome{flex:0 0 118px}

/* ---------- o rodapé ---------- */
.rodape{
  border-top:1px solid var(--regra);
  padding:8px 16px 10px;
  display:flex;
  justify-content:space-between;
  gap:8px 16px;
  flex-wrap:wrap;
  color:var(--cinza);
  font-size:10px;
}
.rodape span{white-space:nowrap}

@media (max-width:480px){
  body{padding-block:14px 20px;font-size:12px}
  .cabeca{padding:12px 12px 8px}
  .status{padding:7px 12px 8px}
  .foto{padding:12px 12px 0}
  .legenda,.comentarios,.rodape{padding-left:12px;padding-right:12px}
  .chat-envio{flex-wrap:wrap}
  .msg-field.nome{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  .no-ar::before{animation:none}
}
</style>
</head>

<body>
<div class="pagina">

  <header class="cabeca">
    <a class="marca" href="/" aria-label="Lagosta Filmes">
      <img src="logo-lagosta-filmes-tight.png" alt="Lagosta Filmes" width="336" height="158">
    </a>
    <span class="lugar">fortaleza, ce</span>
  </header>

  <section class="status" aria-label="status">
    <div class="status-linha">
      <span class="no-ar">no ar</span>
      <span class="ouvindo"><span class="nota">♪</span>ouvindo: <b>lagosta fm – ep. piloto</b></span>
    </div>
    <div class="controles">
      <button id="playBtn" class="botao" type="button">play</button>
      <div class="barra" id="progressBar" role="slider" aria-label="posição do episódio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="progress-bar-fill" id="progressFill"></div>
        <div class="marker-bubble" id="markerBubble"></div>
      </div>
      <span class="tempos"><span id="currentTime">00:00</span> / <span id="totalTime">--:--</span></span>
    </div>
    <!-- áudio (Firebase Storage) -->
    <audio id="audioPlayer" preload="metadata">
      <source src="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-piloto.mp3?alt=media&token=ce87e2ff-d1e1-4e31-9c3d-2aeaa8a3fbde" type="audio/mpeg">
    </audio>
  </section>

  <main>
    <figure class="foto" style="margin:0">
      <img class="imagem" src="poster-fortown.jpg" alt="Fortown! — em breve. Um filme de (nome coberto com fita)" width="1320" height="743">
    </figure>
    <div class="legenda">
      <div class="legenda-linha"><b>fortown!</b><span class="data"><span id="ultimaAtt">—</span></span></div>
      <p>em breve.</p>
      <div class="meta">1 foto · <a href="#comentarios"><span id="recadosCount">0</span> comentários</a></div>
    </div>

    <section class="comentarios" id="comentarios">
      <div class="comentarios-cab">
        <b>comentários</b>
        <span class="quantos" id="recadosCount2"></span>
      </div>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <div class="chat-envio">
        <input id="nickInput" class="msg-field nome" type="text" maxlength="24" placeholder="nome" autocomplete="nickname" aria-label="seu nome">
        <input id="chatInput" class="msg-field" type="text" maxlength="180" placeholder="comentário" autocomplete="off" aria-label="comentário">
        <button id="sendBtn" class="botao" type="button">enviar</button>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <span><a href="mailto:oi.lagostafilmes@gmail.com">oi.lagostafilmes@gmail.com</a> · <a href="https://instagram.com/lagosta.filmes">@lagosta.filmes</a></span>
    <span>lagostafilmes.com</span>
  </footer>

</div>

<!-- SDK Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
/* =========================================================
  NOME (campo do formulário; fica guardado no navegador)
  ========================================================= */
const NICK_KEY = "lagostaNick_v1";
const nickInput = document.getElementById("nickInput");

function loadNick(){
try{
const n = localStorage.getItem(NICK_KEY);
return n || "";
}catch(e){
return "";
}
}
function saveNick(nick){
try{
localStorage.setItem(NICK_KEY, nick);
}catch(e){}
}

let myNick = loadNick();
if(myNick && !/^OUVINTE_\d+$/i.test(myNick)) nickInput.value = myNick;

// o nome que vai no comentário: o do campo; vazio, vira ouvinte_123 (e fica)
function nomeAtual(){
const digitado = nickInput.value.trim();
if(digitado){ myNick = digitado; saveNick(myNick); return myNick; }
if(!myNick){ myNick = "ouvinte_" + Math.floor(Math.random()*1000); saveNick(myNick); }
return myNick;
}
nickInput.addEventListener("keydown",e=>{
if(e.key==="Enter"){ e.preventDefault(); chatInputEl.focus(); }
});

/* =========================================================
  PLAYER / TIMECODE
  ========================================================= */
const audioEl       = document.getElementById("audioPlayer");
const playBtn       = document.getElementById("playBtn");
const progressFill  = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const totalTimeEl   = document.getElementById("totalTime");
const progressBar   = document.getElementById("progressBar");
const markerBubble  = document.getElementById("markerBubble");

function formatTime(sec){
if(isNaN(sec)) return "--:--";
const m = Math.floor(sec/60);
const s = Math.floor(sec%60);
return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

playBtn.addEventListener("click",()=>{
if(audioEl.paused){
audioEl.play();
playBtn.textContent="pause";
}else{
audioEl.pause();
playBtn.textContent="play";
}
});
audioEl.addEventListener("ended",()=>{ playBtn.textContent="play"; });

audioEl.addEventListener("loadedmetadata",()=>{
totalTimeEl.textContent = formatTime(audioEl.duration);
});

audioEl.addEventListener("timeupdate",()=>{
currentTimeEl.textContent = formatTime(audioEl.currentTime);
if(!isNaN(audioEl.duration) && audioEl.duration>0){
const pct = (audioEl.currentTime/audioEl.duration)*100;
progressFill.style.width = pct+"%";
progressBar.setAttribute("aria-valuenow", Math.round(pct));
}
});

// clicar na barra: pular
progressBar.addEventListener("click",(e)=>{
if(e.target.classList.contains("comment-marker")) return;
const rect = progressBar.getBoundingClientRect();
const clickX = e.clientX - rect.left;
const ratio = clickX / rect.width;
if(!isNaN(audioEl.duration)){
audioEl.currentTime = ratio * audioEl.duration;
}
});
// setas: pular 10 s
progressBar.addEventListener("keydown",(e)=>{
if(isNaN(audioEl.duration)) return;
if(e.key==="ArrowRight"){ e.preventDefault(); audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime+10); }
if(e.key==="ArrowLeft"){ e.preventDefault(); audioEl.currentTime = Math.max(0, audioEl.currentTime-10); }
});

/* =========================================================
  COMENTÁRIOS (local + timecode)
  ========================================================= */
const chatLogEl   = document.getElementById("chatLog");
const chatInputEl = document.getElementById("chatInput");
const sendBtn     = document.getElementById("sendBtn");
const contadores  = ["recadosCount","recadosCount2"].map(id=>document.getElementById(id));

const STORAGE_KEY = "lagostaChatMessages_v1";

function loadLocalMessages(){
try{
const raw = localStorage.getItem(STORAGE_KEY);
if(!raw) return [];
return JSON.parse(raw);
}catch(e){
return [];
}
}
function saveLocalMessages(msgs){
try{
localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
}catch(e){}
}

function escapeHtml(str){
return String(str).replace(/[&<>"']/g, s=>({
"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[s]));
}

function dataCurta(m){
const d = new Date(m.at);
const hh=String(m.atHour).padStart(2,"0");
const mm=String(m.atMin).padStart(2,"0");
if(isNaN(d.getTime())) return hh+":"+mm;
const dd=String(d.getDate()).padStart(2,"0");
const mo=String(d.getMonth()+1).padStart(2,"0");
return `${dd}/${mo}/${d.getFullYear()} ${hh}:${mm}`;
}

function renderChat(msgs){
chatLogEl.innerHTML="";
if(contadores[0]) contadores[0].textContent = msgs.length;
if(contadores[1]) contadores[1].textContent = "(" + msgs.length + ")";
if(!msgs.length){
const v=document.createElement("div");
v.className="chat-vazio";
v.textContent="ninguém comentou ainda.";
chatLogEl.appendChild(v);
return;
}
msgs
.sort((a,b)=>a.at-b.at)
.forEach(m=>{
const el=document.createElement("div");
el.className="diz";
el.innerHTML=`<div class="diz-cab"><span><span class="nick">${escapeHtml(m.nick || "ouvinte")}</span> diz:</span><span class="hora">${dataCurta(m)}</span></div><div class="diz-txt">${escapeHtml(m.text)}<span class="at-time" title="ouvir desse ponto" data-t="${Number(m.tAudio)||0}">@${formatTime(m.tAudio)}</span></div>`;
chatLogEl.appendChild(el);
});
chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

// clicar no @tempo de um comentário: pular pra esse ponto do episódio
chatLogEl.addEventListener("click",(e)=>{
const t = e.target.closest(".at-time");
if(!t) return;
const sec = parseFloat(t.dataset.t);
if(!isNaN(sec) && !isNaN(audioEl.duration)){
audioEl.currentTime = sec;
if(audioEl.paused){ audioEl.play(); playBtn.textContent="pause"; }
}
});

function renderMarkers(msgs){
const olds = progressBar.querySelectorAll(".comment-marker");
olds.forEach(o=>o.remove());

if(isNaN(audioEl.duration) || audioEl.duration===0) return;

msgs.forEach(m=>{
if(!(m.tAudio > 0.5)) return; // comentário deixado antes de dar play: fica na lista, sem marca na barra
const pct = (m.tAudio / audioEl.duration) * 100;
const marker = document.createElement("div");
marker.className = "comment-marker";
marker.style.left = `calc(${pct}% - 1px)`;
marker.title = `${formatTime(m.tAudio)} — ${m.text}`;

marker.addEventListener("mouseenter",()=>{
showMarkerBubble(m, marker);
});
marker.addEventListener("mouseleave",()=>{
hideMarkerBubble();
});
marker.addEventListener("click",()=>{
audioEl.currentTime = m.tAudio;
});

progressBar.appendChild(marker);
});
}

function showMarkerBubble(msg, markerEl){
const rect = progressBar.getBoundingClientRect();
const markerRect = markerEl.getBoundingClientRect();
markerBubble.style.display="block";
markerBubble.textContent = `${formatTime(msg.tAudio)} ${msg.nick ? msg.nick + " diz: " : ""}${msg.text}`;
let leftPos = markerRect.left - rect.left;
const maxLeft = Math.max(0, rect.width - 240);
markerBubble.style.left = Math.min(leftPos, maxLeft) + "px";
}
function hideMarkerBubble(){
markerBubble.style.display="none";
}

/* cria e envia um comentário */
function addMessage(text){
if(!text.trim()) return;

const now    = new Date();
const at     = now.getTime();
const atHour = now.getHours();
const atMin  = now.getMinutes();
const tAudio = (!isNaN(audioEl.currentTime)) ? audioEl.currentTime : 0;

const newMsg = {
text: text.trim(),
tAudio,
at,
atHour,
atMin,
nick: nomeAtual()
};

messages.push(newMsg);
saveLocalMessages(messages);
sendToFirebase(newMsg);

renderChat(messages);
renderMarkers(messages);
}

sendBtn.addEventListener("click",()=>{
const v = chatInputEl.value;
if(!v.trim()) return;
addMessage(v);
chatInputEl.value="";
chatInputEl.focus();
});
chatInputEl.addEventListener("keydown",e=>{
if(e.key==="Enter"){
e.preventDefault();
const v = chatInputEl.value;
if(!v.trim()) return;
addMessage(v);
chatInputEl.value="";
}
});

let messages = loadLocalMessages();
audioEl.addEventListener("loadedmetadata",()=>{
renderChat(messages);
renderMarkers(messages);
});
renderChat(messages);

/* =========================================================
  FIREBASE (tempo real)
  ========================================================= */
const firebaseConfig = {
apiKey: "AIzaSyD4tr7eZNSvs3z49ROibvM48mjEZLCImZo",
authDomain: "lagosta-fm.firebaseapp.com",
databaseURL: "https://lagosta-fm-default-rtdb.firebaseio.com",
projectId: "lagosta-fm",
storageBucket: "lagosta-fm.firebasestorage.app",
messagingSenderId: "1037798589381",
appId: "1:1037798589381:web:f9c6b5d7721746994881ac"
};

let firebaseAppRef = null;
let firebaseDbRef  = null;
let firebaseEnabled = false;
let firebaseListening = false;

function firebaseInit(cfg){
firebaseAppRef = firebase.initializeApp(cfg);
firebaseDbRef  = firebase.database();
firebaseEnabled = true;
}
function firebasePushKey(){
const ref = firebaseDbRef.ref("messages");
return ref.push().key;
}
function firebaseWriteMessage(msg,key){
const ref = firebaseDbRef.ref("messages/"+key);
ref.set(msg);
}
function firebaseOnMessage(cb){
const ref = firebaseDbRef.ref("messages");
ref.on("value",(snap)=>{
const data = snap.val() || {};
const list = Object.values(data);
cb(list);
});
}
function sendToFirebase(msg){
if(!firebaseEnabled || !firebaseDbRef) return;
try{
const newKey = firebasePushKey();
firebaseWriteMessage(msg,newKey);
}catch(e){
// silencioso
}
}
function startFirebaseListener(){
if(!firebaseEnabled || !firebaseDbRef || firebaseListening) return;
firebaseListening = true;
firebaseOnMessage((incomingList)=>{
let changed=false;
incomingList.forEach(m=>{
const exists = messages.some(
x => x.at===m.at &&
x.text===m.text &&
Math.abs(x.tAudio - m.tAudio) < 0.01
);
if(!exists){
messages.push(m);
changed=true;
}
});
if(changed){
saveLocalMessages(messages);
renderChat(messages);
renderMarkers(messages);
}
});
}

if(typeof firebase !== "undefined"){
firebaseInit(firebaseConfig);
startFirebaseListener();

firebase.auth().signInAnonymously().catch(err=>{
  console.error("Erro ao autenticar anonimamente:", err);
});

firebase.auth().onAuthStateChanged((user)=>{
  if (user) {
    firebaseEnabled = true;
    startFirebaseListener();
  }
});
}

/* =========================================================
  DATA DA FOTO (data do arquivo no servidor)
  ========================================================= */
(function(){
const el = document.getElementById("ultimaAtt");
const d = new Date(document.lastModified);
if(isNaN(d.getTime())){ el.textContent = "2026"; return; }
const dd = String(d.getDate()).padStart(2,"0");
const mm = String(d.getMonth()+1).padStart(2,"0");
el.textContent = `${dd}/${mm}/${d.getFullYear()}`;
})();
</script>

</body>
</html>
