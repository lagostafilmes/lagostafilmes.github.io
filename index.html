<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lagosta Filmes</title>
<meta name="description" content="Lagosta Filmes. Produtora de filmes e outras coisas. Fortaleza, CE.">

<!-- Favicon Lagosta Filmes -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#A5C7F9">
<meta name="color-scheme" content="light">
<!-- a página tem uma cor só; pede às extensões de modo escuro (Dark Reader) que não a repintem -->
<meta name="darkreader-lock">

<style>
/* Layout: uma página branca de 660px sobre o azul-céu, como um fotolog de 2005 —
   o nome com o status (no ar, ouvindo), a foto do dia (uma tira de super 16), a legenda,
   e os comentários dos amigos, "fulano diz:". Tahoma 11px, links azuis, regras cinza. */
:root{
  --ceu:#BCD4EE;       /* o fundo: um céu mais calmo */
  --branco:#FBF4E4;    /* a página: papel */
  --moldura:#D6C39A;   /* a borda da página */
  --texto:#222018;
  --cinza:#867A62;     /* datas, legendas */
  --regra:#E8DBBE;     /* as linhas */
  --link:#2B4FA8;
  --vermelho:#D23B2C;  /* o vermelho do logo */
  --online:#3DB54A;    /* o verdinho de "online" */
  --campo:#C4B08A;     /* borda de campo de texto */
  --faixa:#FBD899;     /* o creme do logo (o mesmo do avatar do insta): cabeçalho e status */
  --fonte:Tahoma,Verdana,"Segoe UI","DejaVu Sans",sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html{background:var(--ceu) url(bg-lagosta.svg)}  /* o céu com as lagostinhas: em cima e em duas faixas finas dos lados */
body{
  margin:0;
  background:transparent;
  color:var(--texto);
  font:12px/1.55 var(--fonte);
  padding:0 clamp(10px,3vw,40px);
}
img{max-width:100%}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:1px dotted var(--texto);outline-offset:2px}

/* ---------- a página ---------- */
.pagina{background:transparent}
/* o miolo fica numa coluna central; o papel vai até a borda */
/* tudo numa coluna só: a tv, o feed com a lateral e o rodapé têm as mesmas bordas */
/* a lâmina: papel largo, o céu só emoldura */
.corpo,.rodape{background:var(--branco);border-left:1px solid var(--moldura);border-right:1px solid var(--moldura)}
.corpo{border-top:1px solid var(--moldura)}
.corpo > main{max-width:1080px;margin:0 auto}

/* o nome */
.cabeca{
  background:transparent;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:22px 16px 18px;
}
.cabeca .marca{display:block;width:150px;background:var(--faixa);padding:10px 14px;border:1px solid var(--moldura);box-shadow:2px 2px 0 var(--moldura);box-sizing:content-box;line-height:0;transform:rotate(-2deg)}
.cabeca .marca img{width:100%;height:auto;display:block}
.cabeca .lugar{color:var(--cinza);padding-bottom:2px;text-align:center}
/* o mascote: a cara da lagosta, um selinho meio torto */
.mascote{position:absolute;top:12px;right:14px;border:1px solid var(--moldura);transform:rotate(6deg)}
.fim{padding:22px 16px 26px;text-align:center;color:var(--cinza)}
.fim img{display:block;margin:0 auto;width:78px;height:auto;transform:rotate(-14deg)}

/* a rádio: bloco da lateral, irmão da tv */
.radio-topo{display:flex;align-items:baseline;justify-content:space-between}
.radio-topo b{font-size:12px}
.radio .no-ar{color:var(--cinza);font-size:10px}
.radio .no-ar::before,.tv-palco .no-ar::before{width:6px;height:6px;margin-right:4px;vertical-align:0}
.radio{margin:8px 0 2px}
.radio-linha{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.play{
  flex:none;
  width:36px;height:36px;
  border-radius:50%;
  border:0;
  background:var(--vermelho);
  color:var(--branco);
  font:13px/1 var(--fonte);
  cursor:pointer;
  padding:0 0 0 2px;
}
.play:hover{filter:brightness(1.08)}
.radio-ep{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.radio .tempos{margin-left:auto}
.radio .barra{height:30px}
.radio .marker-bubble{max-width:190px;white-space:normal}

/* o status: no ar, ouvindo */
.status{
  background:var(--faixa);
  border-top:1px solid rgba(0,0,0,.08);
  border-bottom:1px solid var(--regra);
  padding:7px 16px 8px;
}
.status-linha{
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  align-items:baseline;
}
.no-ar{white-space:nowrap}
.no-ar::before{
  content:"";
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--online);
  border:1px solid #2E8F3A;
  margin-right:5px;
  vertical-align:-1px;
  animation:pisca 2.4s steps(1) infinite;  /* a bolinha de "online" pisca devagar */
}
@keyframes pisca{50%{opacity:.25}}
.ouvindo{color:var(--texto)}
.visor{
  margin-top:3px;
  font:bold 13px/1.3 Georgia,"Times New Roman",serif;
  color:var(--vermelho);
}
.visor .obs{font:11px var(--fonte);color:var(--cinza);margin-left:4px}
.ouvindo .nota{color:var(--cinza);margin-right:3px}
.controles{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-top:6px;
}
.botao{
  flex:none;
  font:11px/1 var(--fonte);
  color:var(--texto);
  background:linear-gradient(#FDFDFD,#E3E3E3);
  border:1px solid #7A7A7A;
  border-radius:3px;
  padding:4px 10px;
  min-width:52px;
  cursor:pointer;
}
.botao:hover{background:linear-gradient(#FFFFFF,#EDEDED)}
.botao:active{background:#DCDCDC}
/* a barra é uma onda (como no soundcloud): barrinhas cinza, vermelhas onde já tocou */
.barra{
  flex:1;
  min-width:0;
  position:relative;
  height:26px;
  cursor:pointer;
}
.progress-bar-fill{display:none}
.onda{display:flex;align-items:flex-end;gap:1px;height:100%}
.onda i{flex:1;background:var(--campo);opacity:.55;min-width:1px}
.onda i.tocou{background:var(--vermelho);opacity:1}
/* cada recado é um risquinho na onda: só aparece quando o recado está em foco
   (passando o mouse no comentário, ou quando o áudio passa por ele) */
.comment-marker{
  position:absolute;
  top:-3px;
  width:2px;height:32px;
  margin-left:-1px;
  background:var(--texto);
  display:none;
  pointer-events:none;
}
.comment-marker.agora{display:block}
.diz{cursor:default}
.diz:hover .nick{color:var(--vermelho)}
.marker-bubble{
  position:absolute;
  left:0;
  bottom:34px;
  background:var(--branco);
  color:var(--texto);
  border:1px solid var(--moldura);
  box-shadow:1px 1px 0 var(--moldura);
  font:10px/1.3 var(--fonte);
  padding:2px 5px;
  white-space:nowrap;
  display:none;
  pointer-events:none;
  max-width:240px;
  overflow:hidden;
  text-overflow:ellipsis;
  z-index:10;
}
.tempos{
  flex:none;
  font-size:10px;
  color:var(--cinza);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
audio{display:none}

/* ---------- a foto do dia ---------- */
.foto{padding:20px 16px 4px;position:relative}
/* a foto colada meio torta, com um pedaço de fita crepe em cima */
.imagem{
  display:block;
  width:100%;
  height:auto;
  border:6px solid #FFFDF7;
  box-shadow:1px 2px 4px rgba(0,0,0,.25);
  transform:rotate(-.7deg);
}
.foto::before{
  content:"";
  position:absolute;
  top:10px;left:50%;
  width:90px;height:22px;
  margin-left:-45px;
  background:rgba(240,228,190,.85);
  box-shadow:0 1px 1px rgba(0,0,0,.12);
  transform:rotate(2.5deg);
  z-index:1;
}
.legenda{padding:16px 26px 20px}  /* mesma margem da tv, pra alinhar */
.legenda-linha{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.legenda-linha b{font-size:12px}
.legenda-linha .data{color:var(--cinza);white-space:nowrap}
.legenda p{margin:2px 0 0}
.legenda .meta{color:var(--cinza);margin-top:4px}

.legenda #postTexto p{margin:2px 0 0}
.legenda #postTexto p+p{margin-top:8px}
.rascunho{color:var(--vermelho);font-weight:bold;margin-left:6px}

/* ---------- corpo: feed à esquerda, a produtora à direita ---------- */
.corpo{display:block}
.bloco{padding:8px 14px 10px;border-bottom:1px solid var(--regra)}
.bloco b{font-size:12px}
.bloco p{margin:4px 0 0}
.bloco ul{margin:4px 0 0;padding:0;list-style:none}
.bloco li{margin:3px 0}
.obs{color:var(--cinza);font-size:10px}
.assina{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.assina .botao{align-self:flex-start}

/* ---------- lagosta tv: o palco da home, uma faixa escura com a tela grande ---------- */
.tv-palco{padding:26px 26px 22px;border-bottom:1px solid var(--regra)}
.tv{
  position:relative;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  border:1px solid var(--texto);
  box-shadow:3px 3px 0 var(--moldura);
}
.tv video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.tv::after{  /* as linhas da tela, bem de leve */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);
}
.sem-sinal{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,#BFBFBF 0 14.3%,#BFBF3C 0 28.6%,#3CBFBF 0 42.9%,#3CBF3C 0 57.1%,#BF3CBF 0 71.4%,#BF3C3C 0 85.7%,#3C3CBF 0);
}
.sem-sinal span{background:#111;color:#EEE;font:bold 11px/1 var(--fonte);letter-spacing:1px;padding:4px 8px;text-transform:uppercase}
.tv [hidden]{display:none}
.tv{cursor:pointer}
/* o botão de som fica no canto do vídeo, como num player */
.tv-som{
  position:absolute;left:12px;bottom:12px;z-index:3;
  width:28px;height:28px;border-radius:50%;border:0;
  background:rgba(20,18,14,.35);color:#fff;font-size:12px;line-height:28px;padding:0;cursor:pointer;
  filter:grayscale(1);
}
.tv-som:hover{background:rgba(20,18,14,.55)}
/* o botão só aparece com o mouse em cima do vídeo (no celular, uns segundos depois de tocar) */
.tv-som{opacity:0;transition:opacity .2s}
.tv:hover .tv-som,.tv-som:focus-visible,.tv.mostra .tv-som{opacity:.75}
/* a marca da lagosta no canto da tela, como selo de emissora */
.tv-marca{position:absolute;bottom:4%;right:2.5%;width:7%;min-width:28px;z-index:2;opacity:.9;pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.tv-barra{
  margin:10px 0 0;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--texto);
}
.tv-nome{font-size:12px}
.tv-palco .no-ar{color:var(--cinza);font-size:10px;margin-right:4px}
.tv-botoes{display:flex;gap:6px}
.tv-botao{
  font:11px/1 var(--fonte);color:var(--texto);background:transparent;
  border:1px solid var(--campo);padding:5px 9px;cursor:pointer;
}
.tv-botao:hover{border-color:var(--texto)}

/* ---------- o feed: cada post do seu jeito ---------- */
.item{border-bottom:1px solid var(--regra);padding-bottom:4px}
.tipo{
  display:inline-block;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--faixa);
  background:var(--texto);
  padding:1px 4px;
  margin-right:6px;
  vertical-align:1px;
}
.tipo.t-episodio{background:var(--vermelho)}
.tipo.t-texto{background:var(--link)}
.item .titulo-texto{
  display:block;
  font:bold 17px/1.25 Georgia,"Times New Roman",serif;
  color:var(--texto);
  margin:4px 0 2px;
}
.item .ler{font-weight:bold}
.legenda-linha a.data{color:var(--cinza)}
.legenda-linha a.nome-data{color:var(--texto);font-weight:bold;font-size:14px}
.nota-txt p{margin:4px 0 0;font-size:12px}
.tipo.t-nota{background:var(--cinza)}
.tipo.t-indica{background:#3E7A4F}
.voltar{padding:10px 16px 0}

/* ---------- modo leitura: letra grande, coluna estreita ---------- */
.leitura{padding:6px 16px 18px}
.leitura h1{font:bold 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px;color:var(--texto)}
.leitura .data{color:var(--cinza)}
.leitura .prosa{max-width:34em;margin-top:14px}
.leitura .prosa p{font:16px/1.7 Georgia,"Times New Roman",serif;margin:0 0 1em}
.leitura .prosa h2{font:bold 18px/1.3 Georgia,"Times New Roman",serif;margin:1.6em 0 .5em}
.leitura .prosa blockquote{font:italic 18px/1.5 Georgia,"Times New Roman",serif;color:var(--vermelho);border-left:3px solid var(--vermelho);margin:1.2em 0;padding:0 0 0 14px}
.links{margin:8px 0 2px;padding-left:20px}
.links li{margin:0 0 9px;font-size:12px}
.links li a{font-weight:bold}
.tipo.t-links{background:#6B4E8A}

/* ---------- os comentários ---------- */
.comentarios{
  border-top:1px solid var(--regra);
  padding:10px 16px 14px;
}
.comentarios-cab{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.comentarios-cab b{font-size:12px}
summary.comentarios-cab{display:list-item;cursor:pointer;color:var(--link)}
summary.comentarios-cab b{font-size:11px}
details.comentarios{border-top:0;padding:4px 0 6px}
.comentarios-cab .quantos{color:var(--cinza)}
.chat-log{margin-top:6px}
.diz{
  padding:7px 0;
  border-top:1px solid var(--regra);
}
.diz:first-child{border-top:0}
.diz-cab{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.diz-cab .nick{font-weight:bold}
.diz-cab .hora{color:var(--cinza);font-size:10px;white-space:nowrap}
.diz-txt{padding-left:10px;overflow-wrap:anywhere}
.diz-txt .at-time{font-size:10px;color:var(--link);margin-left:5px;cursor:pointer}
.chat-vazio{color:var(--cinza);padding:6px 0}
.chat-envio{
  display:flex;
  gap:6px;
  margin-top:8px;
  padding-top:10px;
  border-top:1px solid var(--regra);
}
.msg-field{
  flex:1;
  min-width:0;
  font:11px/1.4 var(--fonte);
  color:var(--texto);
  background:#FFFDF7;
  border:1px solid var(--campo);
  border-radius:0;
  padding:3px 4px;
}
.msg-field:focus{outline:1px solid var(--link);outline-offset:-1px}
.msg-field.nome{flex:0 0 118px}

/* ---------- o rodapé ---------- */
.rodape{
  margin:0 0 clamp(10px,3vw,40px);border-bottom:1px solid var(--moldura);
  padding-left:max(16px,calc((100% - 1080px)/2 + 26px));padding-right:max(16px,calc((100% - 1080px)/2 + 26px));
  padding-top:18px;padding-bottom:30px;
  border-top:1px solid var(--regra);
  display:flex;justify-content:space-between;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;
  color:var(--cinza);
}
.rodape p{margin:0}
.rodape .assina{flex-direction:row;margin:0}
.rodape .assina .msg-field{width:170px;flex:none}
.rodape span{white-space:nowrap}
/* selinhos 88x31, como os botões dos sites de 2005 */
.selos{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 12px}
.selo{
  width:88px;height:31px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  font:bold 9px/1.05 var(--fonte);
  border:1px solid #000;
  text-transform:uppercase;
}
.selo.s1{background:var(--vermelho);color:var(--faixa)}
.selo.s2{background:var(--texto);color:var(--faixa)}
.selo.s3{background:var(--ceu);color:var(--texto)}
.selo.s4{background:var(--faixa);color:var(--texto)}
a.selo:hover{text-decoration:none;outline:2px solid var(--texto);outline-offset:-2px}

/* em tela estreita a lateral desce pro fim */
@media (max-width:700px){
  .corpo{display:block}
}
@media (max-width:480px){
  .bloco,.leitura,.voltar{padding-left:12px;padding-right:12px}
  body{padding:0 8px;font-size:12px}
  .tv-palco{padding:16px 12px 14px}
  .cabeca{padding:12px 12px 8px}
  .status{padding:7px 12px 8px}
  .foto{padding:12px 12px 0}
  .legenda,.comentarios,.rodape{padding-left:12px;padding-right:12px}
  .chat-envio{flex-wrap:wrap}
  .msg-field.nome{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  .no-ar::before{animation:none}
}
</style>
</head>

<body>
<div class="pagina">

  <header class="cabeca">
    <a class="marca" href="/" aria-label="Lagosta Filmes">
      <img src="logo-lagosta-filmes-tight.png" alt="Lagosta Filmes" width="336" height="158">
    </a>
  </header>



  <div class="corpo">
  <main>
    <!-- lagosta tv: canal 24/7, o palco da home (só aparece quando houver programação) -->
    <section class="tv-palco" id="tvCanto" aria-label="lagosta tv" hidden>
      <div class="tv" id="tvTela">
        <img class="tv-marca" src="lagosta-cheia.svg" alt="" aria-hidden="true">
        <button class="tv-som" id="tvSom" type="button" aria-label="ligar o som" hidden>🔇</button>
        <video id="tvVideo" muted playsinline preload="metadata" hidden></video>
        <div class="sem-sinal" id="tvSemSinal"><span>sem sinal</span></div>
      </div>
    </section>
    <!-- o feed: todos os posts, do mais novo pro mais velho (preenchido pelo script) -->
    <section id="feed" aria-label="posts"></section>

    <!-- um post aberto sozinho (lagostafilmes.com/#id); textos abrem em modo leitura -->
    <article id="post" hidden>
      <div class="voltar"><a href="#">← início</a></div>
      <div id="postCorpo"></div>
    </article>

    <!-- o player e os recados do piloto: o script põe os dois dentro do post do episódio -->
    <section class="radio" id="radio" aria-label="lagosta fm">
      <div class="radio-linha">
        <button id="playBtn" class="play" type="button" aria-label="tocar / pausar">▶</button>
        <span class="tempos"><span id="currentTime">00:00</span> / <span id="totalTime">--:--</span></span>
      </div>
      <div class="barra" id="progressBar" role="slider" aria-label="posição do episódio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="progress-bar-fill" id="progressFill"></div>
        <div class="marker-bubble" id="markerBubble"></div>
      </div>
    <!-- áudio (Firebase Storage) -->
    <audio id="audioPlayer" preload="metadata">
      <source src="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-piloto.mp3?alt=media&token=ce87e2ff-d1e1-4e31-9c3d-2aeaa8a3fbde" type="audio/mpeg">
    </audio>
    </section>
    <details class="comentarios" id="comentarios">
      <summary class="comentarios-cab"><b>comentários</b> <span class="quantos" id="recadosCount2"></span></summary>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <div class="chat-envio">
        <input id="nickInput" class="msg-field nome" type="text" maxlength="24" placeholder="nome" autocomplete="nickname" aria-label="seu nome">
        <input id="chatInput" class="msg-field" type="text" maxlength="180" placeholder="comentário" autocomplete="off" aria-label="comentário">
        <button id="sendBtn" class="botao" type="button">enviar</button>
      </div>
    </details>
  </main>

  <!-- a lateral: a produtora, como a coluna de perfil dos fotologs -->
  </div>

  <footer class="rodape">
    <p>produtora de filmes e outras coisas. fortaleza, ce.<br><a href="mailto:oi.lagostafilmes@gmail.com">oi.lagostafilmes@gmail.com</a></p>
    <form class="assina" id="assinaForm" method="post" target="_blank">
      <input class="msg-field" type="email" name="email" placeholder="e-mail" required aria-label="seu e-mail">
      <button class="botao" type="submit">se inscrever</button>
    </form>
    <p class="obs" id="assinaAviso" hidden>(ainda não ligado a um serviço de newsletter)</p>
  </footer>
</div>

<!-- SDK Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
/* =========================================================
  NOME (campo do formulário; fica guardado no navegador)
  ========================================================= */
const NICK_KEY = "lagostaNick_v1";
const nickInput = document.getElementById("nickInput");

function loadNick(){
try{
const n = localStorage.getItem(NICK_KEY);
return n || "";
}catch(e){
return "";
}
}
function saveNick(nick){
try{
localStorage.setItem(NICK_KEY, nick);
}catch(e){}
}

let myNick = loadNick();
if(myNick && !/^OUVINTE_\d+$/i.test(myNick)) nickInput.value = myNick;

// o nome que vai no comentário: o do campo; vazio, vira ouvinte_123 (e fica)
function nomeAtual(){
const digitado = nickInput.value.trim();
if(digitado){ myNick = digitado; saveNick(myNick); return myNick; }
if(!myNick){ myNick = "ouvinte_" + Math.floor(Math.random()*1000); saveNick(myNick); }
return myNick;
}
nickInput.addEventListener("keydown",e=>{
if(e.key==="Enter"){ e.preventDefault(); chatInputEl.focus(); }
});

/* =========================================================
  PLAYER / TIMECODE
  ========================================================= */
const audioEl       = document.getElementById("audioPlayer");
const playBtn       = document.getElementById("playBtn");
const progressFill  = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const totalTimeEl   = document.getElementById("totalTime");
const progressBar   = document.getElementById("progressBar");
const markerBubble  = document.getElementById("markerBubble");

// a onda: barrinhas de alturas variadas (desenho fixo, não é o áudio de verdade)
const onda = document.createElement("div");
onda.className = "onda";
const N_BARRAS = 110;
for(let i=0;i<N_BARRAS;i++){
const b = document.createElement("i");
const h = 0.35 + 0.35*Math.abs(Math.sin(i*0.37)) + 0.3*Math.abs(Math.sin(i*1.91+1));
b.style.height = Math.round(Math.min(1,h)*100) + "%";
onda.appendChild(b);
}
progressBar.prepend(onda);
function pintarOnda(pct){
const ate = Math.floor(pct/100*N_BARRAS);
onda.childNodes.forEach((b,i)=>b.classList.toggle("tocou", i < ate));
}

function formatTime(sec){
if(isNaN(sec)) return "--:--";
const m = Math.floor(sec/60);
const s = Math.floor(sec%60);
return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

playBtn.addEventListener("click",()=>{
if(audioEl.paused){
audioEl.play();
playBtn.textContent="❚❚";
}else{
audioEl.pause();
playBtn.textContent="▶";
}
});
audioEl.addEventListener("ended",()=>{ playBtn.textContent="▶"; });

// a duração às vezes só chega depois (e o safari às vezes dá "infinito" no começo)
function mostrarTotal(){ if(isFinite(audioEl.duration) && audioEl.duration > 0) totalTimeEl.textContent = formatTime(audioEl.duration); }
audioEl.addEventListener("loadedmetadata", mostrarTotal);
audioEl.addEventListener("durationchange", mostrarTotal);

audioEl.addEventListener("timeupdate",()=>{
currentTimeEl.textContent = formatTime(audioEl.currentTime);
mostrarTotal();
if(!isNaN(audioEl.duration) && audioEl.duration>0){
const pct = (audioEl.currentTime/audioEl.duration)*100;
progressFill.style.width = pct+"%";
pintarOnda(pct);
progressBar.setAttribute("aria-valuenow", Math.round(pct));
}
});

// clicar na barra: pular
progressBar.addEventListener("click",(e)=>{
if(e.target.classList.contains("comment-marker")) return;
const rect = progressBar.getBoundingClientRect();
const clickX = e.clientX - rect.left;
const ratio = clickX / rect.width;
if(!isNaN(audioEl.duration)){
audioEl.currentTime = ratio * audioEl.duration;
}
});
// setas: pular 10 s
progressBar.addEventListener("keydown",(e)=>{
if(isNaN(audioEl.duration)) return;
if(e.key==="ArrowRight"){ e.preventDefault(); audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime+10); }
if(e.key==="ArrowLeft"){ e.preventDefault(); audioEl.currentTime = Math.max(0, audioEl.currentTime-10); }
});

/* =========================================================
  COMENTÁRIOS (local + timecode)
  ========================================================= */
const chatLogEl   = document.getElementById("chatLog");
const chatInputEl = document.getElementById("chatInput");
const sendBtn     = document.getElementById("sendBtn");
const contadores  = ["recadosCount","recadosCount2"].map(id=>document.getElementById(id));

const STORAGE_KEY = "lagostaChatMessages_v1";

function loadLocalMessages(){
try{
const raw = localStorage.getItem(STORAGE_KEY);
if(!raw) return [];
return JSON.parse(raw);
}catch(e){
return [];
}
}
function saveLocalMessages(msgs){
try{
localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
}catch(e){}
}

function escapeHtml(str){
return String(str).replace(/[&<>"']/g, s=>({
"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[s]));
}

function dataCurta(m){
const d = new Date(m.at);
const hh=String(m.atHour).padStart(2,"0");
const mm=String(m.atMin).padStart(2,"0");
if(isNaN(d.getTime())) return hh+":"+mm;
const dd=String(d.getDate()).padStart(2,"0");
const mo=String(d.getMonth()+1).padStart(2,"0");
return `${dd}/${mo}/${d.getFullYear()} ${hh}:${mm}`;
}

function renderChat(msgs){
chatLogEl.innerHTML="";
if(contadores[0]) contadores[0].textContent = msgs.length;
if(contadores[1]) contadores[1].textContent = "(" + msgs.length + ")";
if(!msgs.length){
const v=document.createElement("div");
v.className="chat-vazio";
v.textContent="ninguém comentou ainda.";
chatLogEl.appendChild(v);
return;
}
msgs
.sort((a,b)=>a.at-b.at)
.forEach(m=>{
const el=document.createElement("div");
el.className="diz";
el.dataset.at = m.at;
el.innerHTML=`<div class="diz-cab"><span><span class="nick">${escapeHtml(m.nick || "ouvinte")}</span> diz:</span><span class="hora">${dataCurta(m)}</span></div><div class="diz-txt">${escapeHtml(m.text)}<span class="at-time" title="ouvir desse ponto" data-t="${Number(m.tAudio)||0}">@${formatTime(m.tAudio)}</span></div>`;
chatLogEl.appendChild(el);
});
chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

// clicar no @tempo de um comentário: pular pra esse ponto do episódio
chatLogEl.addEventListener("click",(e)=>{
const t = e.target.closest(".at-time");
if(!t) return;
const sec = parseFloat(t.dataset.t);
if(!isNaN(sec) && !isNaN(audioEl.duration)){
audioEl.currentTime = sec;
if(audioEl.paused){ audioEl.play(); playBtn.textContent="❚❚"; }
}
});

function renderMarkers(msgs){
const olds = progressBar.querySelectorAll(".comment-marker");
olds.forEach(o=>o.remove());

if(isNaN(audioEl.duration) || audioEl.duration===0) return;

msgs.forEach(m=>{
if(!(m.tAudio > 0.5)) return; // comentário deixado antes de dar play: fica na lista, sem marca na barra
const pct = (m.tAudio / audioEl.duration) * 100;
const marker = document.createElement("div");
marker.className = "comment-marker";
marker.style.left = pct + "%";
marker.dataset.at = m.at;
marker.setAttribute("aria-label", `${formatTime(m.tAudio)} ${m.nick || ""}: ${m.text}`);

marker._msg = m;

progressBar.appendChild(marker);
});
}

function showMarkerBubble(msg, markerEl){
const rect = progressBar.getBoundingClientRect();
const markerRect = markerEl.getBoundingClientRect();
markerBubble.style.display="block";
markerBubble.textContent = `${formatTime(msg.tAudio)} ${msg.nick ? msg.nick + " diz: " : ""}${msg.text}`;
let leftPos = markerRect.left - rect.left;
const maxLeft = Math.max(0, rect.width - 240);
markerBubble.style.left = Math.min(leftPos, maxLeft) + "px";
}
// passar o mouse num comentário: mostra onde ele cai na onda
function focarRecado(at){
progressBar.querySelectorAll(".agora").forEach(x=>x.classList.remove("agora"));
const mk = at ? progressBar.querySelector(`.comment-marker[data-at="${at}"]`) : null;
if(!mk){ hideMarkerBubble(); return; }
mk.classList.add("agora");
showMarkerBubble(mk._msg, mk);
}
chatLogEl.addEventListener("mouseover",e=>{
const d = e.target.closest(".diz");
if(d) focarRecado(d.dataset.at);
});
chatLogEl.addEventListener("mouseleave",()=>focarRecado(null));

// como no soundcloud: quando o áudio passa por um recado, ele aparece por uns segundos
let ultimoT = 0, timerRecado = null;
audioEl.addEventListener("timeupdate",()=>{
const t = audioEl.currentTime;
if(t > ultimoT && t - ultimoT < 2){
const mk = [...progressBar.querySelectorAll(".comment-marker")]
.find(el => el._msg.tAudio > ultimoT && el._msg.tAudio <= t);
if(mk){
progressBar.querySelectorAll(".agora").forEach(x=>x.classList.remove("agora"));
mk.classList.add("agora");
showMarkerBubble(mk._msg, mk);
clearTimeout(timerRecado);
timerRecado = setTimeout(()=>{ mk.classList.remove("agora"); hideMarkerBubble(); }, 4000);
}
}
ultimoT = t;
});
function hideMarkerBubble(){
markerBubble.style.display="none";
}

/* cria e envia um comentário */
function addMessage(text){
if(!text.trim()) return;

const now    = new Date();
const at     = now.getTime();
const atHour = now.getHours();
const atMin  = now.getMinutes();
const tAudio = (!isNaN(audioEl.currentTime)) ? audioEl.currentTime : 0;

const newMsg = {
text: text.trim(),
tAudio,
at,
atHour,
atMin,
nick: nomeAtual()
};

messages.push(newMsg);
saveLocalMessages(messages);
sendToFirebase(newMsg);

renderChat(messages);
renderMarkers(messages);
}

sendBtn.addEventListener("click",()=>{
const v = chatInputEl.value;
if(!v.trim()) return;
addMessage(v);
chatInputEl.value="";
chatInputEl.focus();
});
chatInputEl.addEventListener("keydown",e=>{
if(e.key==="Enter"){
e.preventDefault();
const v = chatInputEl.value;
if(!v.trim()) return;
addMessage(v);
chatInputEl.value="";
}
});

let messages = loadLocalMessages();
audioEl.addEventListener("loadedmetadata",()=>{
renderChat(messages);
renderMarkers(messages);
});
renderChat(messages);

/* =========================================================
  FIREBASE (tempo real)
  ========================================================= */
const firebaseConfig = {
apiKey: "AIzaSyD4tr7eZNSvs3z49ROibvM48mjEZLCImZo",
authDomain: "lagosta-fm.firebaseapp.com",
databaseURL: "https://lagosta-fm-default-rtdb.firebaseio.com",
projectId: "lagosta-fm",
storageBucket: "lagosta-fm.firebasestorage.app",
messagingSenderId: "1037798589381",
appId: "1:1037798589381:web:f9c6b5d7721746994881ac"
};

let firebaseAppRef = null;
let firebaseDbRef  = null;
let firebaseEnabled = false;
let firebaseListening = false;

function firebaseInit(cfg){
firebaseAppRef = firebase.initializeApp(cfg);
firebaseDbRef  = firebase.database();
firebaseEnabled = true;
}
function firebasePushKey(){
const ref = firebaseDbRef.ref("messages");
return ref.push().key;
}
function firebaseWriteMessage(msg,key){
const ref = firebaseDbRef.ref("messages/"+key);
ref.set(msg);
}
function firebaseOnMessage(cb){
const ref = firebaseDbRef.ref("messages");
ref.on("value",(snap)=>{
const data = snap.val() || {};
const list = Object.values(data);
cb(list);
});
}
function sendToFirebase(msg){
if(!firebaseEnabled || !firebaseDbRef) return;
try{
const newKey = firebasePushKey();
firebaseWriteMessage(msg,newKey);
}catch(e){
// silencioso
}
}
function startFirebaseListener(){
if(!firebaseEnabled || !firebaseDbRef || firebaseListening) return;
firebaseListening = true;
firebaseOnMessage((incomingList)=>{
let changed=false;
incomingList.forEach(m=>{
const exists = messages.some(
x => x.at===m.at &&
x.text===m.text &&
Math.abs(x.tAudio - m.tAudio) < 0.01
);
if(!exists){
messages.push(m);
changed=true;
}
});
if(changed){
saveLocalMessages(messages);
renderChat(messages);
renderMarkers(messages);
}
});
}

if(typeof firebase !== "undefined"){
firebaseInit(firebaseConfig);
startFirebaseListener();

firebase.auth().signInAnonymously().catch(err=>{
  console.error("Erro ao autenticar anonimamente:", err);
});

firebase.auth().onAuthStateChanged((user)=>{
  if (user) {
    firebaseEnabled = true;
    startFirebaseListener();
  }
});
}

/* =========================================================
  POSTS (o feed, do mais novo pro mais velho)
  Pra postar: acrescente um objeto no topo da lista.
  - id: curto, sem espaço (vira o endereço: lagostafilmes.com/#ep-2)
  - tipo: "foto", "episodio", "texto", "nota" ou "indica"
      foto     → imagem com legenda
      episodio → rádio
      texto    → artigo: aparece a chamada no feed e abre em modo leitura
      nota     → texto curto, aparece inteiro no feed (como legenda de insta)
      indica   → uma indicação: link pra fora + o que você achou
      links    → uma lista curada (itens: titulo, link, fonte, nota)
  - data: "aaaa-mm-dd"
  - titulo; imagem (arquivo na raiz, opcional)
  - resumo: a frase que aparece no feed
  - texto: lista de parágrafos (texto puro, sem html)
  - link, fonte: só no "indica" (o endereço e de onde é)
  - recados: true põe os recados da rádio dentro desse post
  - rascunho: true esconde o post; ele só aparece com ?rascunho no endereço
  ========================================================= */
const POSTS = [
{
id: "lagosta-fm-piloto",
tipo: "episodio",
data: "2025-10-27",
recados: true
}
];

(function(){
const verRascunhos = new URLSearchParams(location.search).has("rascunho") || location.hostname === "localhost";  // no seu mac, os rascunhos sempre aparecem
const posts = POSTS.filter(p => verRascunhos || !p.rascunho);
const feed = document.getElementById("feed");
const postEl = document.getElementById("post");
const postCorpo = document.getElementById("postCorpo");
const recados = document.getElementById("comentarios");
const NOMES = {foto:"foto", episodio:"rádio", texto:"texto", nota:"nota", indica:"indica", links:"links"};

function el(tag, cls, txt){
const e = document.createElement(tag);
if(cls) e.className = cls;
if(txt != null) e.textContent = txt;
return e;
}
function dataBr(s){
const [a,m,d] = String(s).split("-");
return (a && m && d) ? `${d}/${m}/${a}` : "";
}
function linkProPost(p, txt, cls){
const a = el("a", cls || null, txt);
a.href = "#" + p.id;
return a;
}
function cabecalho(p){
const linha = el("div","legenda-linha");
const esq = el("span");
esq.append(el("span","tipo t-"+p.tipo, NOMES[p.tipo] || p.tipo));
// episódio sem título (o normal): o nome é a data. com título (episódio temático), a data vai do lado
const dataComoNome = p.tipo === "episodio" && !p.titulo;
if(dataComoNome) esq.append(linkProPost(p, dataBr(p.data), "nome-data"));
else if(p.titulo && (p.tipo === "foto" || p.tipo === "episodio")) esq.append(el("b", null, p.titulo));
if(p.rascunho) esq.append(el("span","rascunho","rascunho"));
// a data é o link permanente do post
linha.append(esq);
if(!dataComoNome) linha.append(linkProPost(p, dataBr(p.data), "data"));
return linha;
}
function foto(p){
if(!p.imagem) return null;
const f = el("figure","foto");
f.style.margin = "0";
const img = el("img","imagem");
img.src = p.imagem; img.alt = p.alt || p.titulo || ""; img.loading = "lazy";
f.append(img);
return f;
}
// "## " no começo vira intertítulo; "> " vira citação; o resto é parágrafo
function paragrafos(lista, caixa){
(lista || []).forEach(par=>{
if(par.startsWith("## ")) caixa.append(el("h2", null, par.slice(3)));
else if(par.startsWith("> ")) caixa.append(el("blockquote", null, par.slice(2)));
else caixa.append(el("p", null, par));
});
}

// um post no feed
function itemDoFeed(p){
const item = el("div","item");
const f = foto(p);
if(f) item.append(f);
const leg = el("div","legenda");
leg.append(cabecalho(p));

if(p.tipo === "texto"){
leg.append(linkProPost(p, p.titulo, "titulo-texto"));
}
if(p.tipo === "indica"){
const a = el("a","titulo-texto", p.titulo + " ↗");
a.href = p.link; a.target = "_blank"; a.rel = "noopener";
leg.append(a);
if(p.fonte) leg.append(el("div","obs", p.fonte));
}
if(p.tipo === "links"){
leg.append(linkProPost(p, p.titulo, "titulo-texto"));
}
if(p.resumo) leg.append(el("p", null, p.resumo));
if(p.tipo === "links"){
const ol = el("ol","links");
(p.itens || []).forEach(it=>{
const li = el("li");
const a = el("a", null, it.titulo + " ↗");
a.href = it.link; a.target = "_blank"; a.rel = "noopener";
li.append(a);
if(it.fonte) li.append(el("span","obs"," " + it.fonte));
if(it.nota) li.append(el("div", null, it.nota));
ol.append(li);
});
leg.append(ol);
}
if(p.tipo === "nota" || p.tipo === "indica"){
const caixa = el("div","nota-txt");
paragrafos(p.texto, caixa);
leg.append(caixa);
}

const meta = el("div","meta");
if(p.tipo === "texto"){
meta.append(linkProPost(p, "ler →", "ler"));
}
if(meta.childNodes.length) leg.append(meta);
if(p.recados) leg.dataset.recados = "1";
item.append(leg);
return item;
}

// os recados moram dentro do post que tem recados: true (o que estiver à vista)
function moverRecados(){
const vis = (postEl.hidden ? feed : postCorpo).querySelector("[data-recados]");
const radio = document.getElementById("radio");
if(vis){ vis.append(radio, recados); recados.hidden = false; radio.hidden = false; }
else{ recados.hidden = true; radio.hidden = true; }
}

// um post aberto sozinho; texto em modo leitura
function abrir(p){
postCorpo.innerHTML = "";
if(p.tipo === "texto"){
const art = el("div","leitura");
art.append(cabecalho(p), el("h1", null, p.titulo));
if(p.resumo) art.append(el("p","data", p.resumo));
const prosa = el("div","prosa");
paragrafos(p.texto, prosa);
art.append(prosa);
postCorpo.append(art);
}else{
postCorpo.append(itemDoFeed(p));
}
document.title = `${p.titulo || dataBr(p.data) || NOMES[p.tipo]} · Lagosta Filmes`;
}

function mostrar(){
const id = decodeURIComponent(location.hash.slice(1));
const p = posts.find(x => x.id === id);
if(p){
abrir(p);
feed.hidden = true; postEl.hidden = false;
window.scrollTo(0,0);
}else{
feed.hidden = false; postEl.hidden = true;
document.title = "Lagosta Filmes";
}
moverRecados();
}

posts.forEach(p => feed.append(itemDoFeed(p)));
// o fim do feed: não tem mais nada, e tudo bem
const fim = el("div","fim");
const masc = el("img"); masc.src = "lagosta.svg"; masc.alt = ""; masc.width = 110; masc.height = 110;
fim.append(masc);
feed.append(fim);

window.addEventListener("hashchange", mostrar);
mostrar();
})();

const TV_INICIO = Date.parse("2026-11-01T00:00:00-03:00");  // a hora em que o canal "entrou no ar"

const TV_TESTE = [
{fonte: "carro", data: "2026-11-10", video: ".claude/teste-tv/carro-20261110-b7b0e0.mp4", duracao: 37.75},

{fonte: "fuji", data: "2026-11-10", video: ".claude/teste-tv/fuji-20261110-225fdb.mp4", duracao: 45.0}
];

(function(){
const grade = TV_PROGRAMACAO.length ? TV_PROGRAMACAO
: (location.hostname === "localhost" ? TV_TESTE : []);
const canto = document.getElementById("tvCanto");
if(!grade.length) return;  // sem programação: o bloco da tv nem aparece
canto.hidden = false;

const tv = document.getElementById("tvVideo");
const semSinal = document.getElementById("tvSemSinal");
const botaoSom = document.getElementById("tvSom");
const total = grade.reduce((s,g)=>s + g.duracao, 0);
const DIA = 86400000;


// embaralho com semente: o mesmo dia dá sempre a mesma ordem
function sorteio(semente){
let x = semente >>> 0 || 1;
return ()=>{ x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };
}
function ordemDoDia(dia){
const r = sorteio(dia * 2654435761);
// trechos com o mesmo "par" viram um bloco só, que passa inteiro e em ordem
const blocos = [], pares = {};
grade.forEach(g=>{
if(g.par){ if(!pares[g.par]){ pares[g.par] = []; blocos.push(pares[g.par]); } pares[g.par].push(g); }
else blocos.push([g]);
});
const porFonte = {};
blocos.forEach(b => (porFonte[b[0].fonte || "-"] ||= []).push(b));
const filas = Object.values(porFonte).map(f=>{
f = f.slice();
for(let i=f.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [f[i],f[j]] = [f[j],f[i]]; }
return f;
});
// entremeia: cada fonte se espalha por igual ao longo do dia
// (se tem muito mais carro que bike, os de bike aparecem distribuídos no meio)
const marcados = [];
filas.forEach(f=>{
const desloc = r();
f.forEach((g,k)=>marcados.push({g, chave:(k + desloc)/f.length}));
});
return marcados.sort((a,b)=>a.chave-b.chave).flatMap(m=>m.g);
}

// o que está passando neste instante: qual trecho e em que segundo dele
function noAr(t){
const dia = Math.floor((t - TV_INICIO)/DIA);
const ordem = ordemDoDia(dia);
let pos = (((t - TV_INICIO) % DIA)/1000) % total;
if(pos < 0) pos += total;
for(let i=0;i<ordem.length;i++){
if(pos < ordem[i].duracao) return {ordem, i, g: ordem[i], seg: pos, falta: ordem[i].duracao - pos};
pos -= ordem[i].duracao;
}
return {ordem, i:0, g: ordem[0], seg:0, falta: ordem[0].duracao};
}

let atual = null;
function sintonizar(){
const agora = Date.now();
const n = noAr(agora);
if(n.g !== atual){
atual = n.g;
tv.src = n.g.video;
}
// só corrige o tempo se estiver muito fora (evita engasgo)
if(Math.abs(tv.currentTime - n.seg) > 2) tv.currentTime = n.seg;
tv.play().catch(()=>{});
tv.hidden = false; semSinal.hidden = true; botaoSom.hidden = false;

}

tv.addEventListener("loadedmetadata", ()=>{
const n = noAr(Date.now());
if(n.g !== atual) sintonizar();   // enquanto carregava, a grade já passou pro próximo
else tv.currentTime = n.seg;
});
tv.addEventListener("ended", sintonizar);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) sintonizar(); });
setInterval(sintonizar, 15000);
sintonizar();

// clicar no vídeo também liga/desliga o som
let timerMostra = null;
document.getElementById("tvTela").addEventListener("click", e=>{
if(e.target !== botaoSom) botaoSom.click();
// no celular não tem "mouse em cima": mostra o botão por uns segundos
const t = document.getElementById("tvTela");
t.classList.add("mostra"); clearTimeout(timerMostra);
timerMostra = setTimeout(()=>t.classList.remove("mostra"), 2500);
});
botaoSom.addEventListener("click",()=>{
tv.muted = !tv.muted;
botaoSom.textContent = tv.muted ? "🔇" : "🔊";
botaoSom.setAttribute("aria-label", tv.muted ? "ligar o som" : "desligar o som");
if(!tv.muted) calarRadio();
});
})();

// tv e rádio não falam ao mesmo tempo: quem liga o som cala o outro
function calarRadio(){
if(!audioEl.paused){ audioEl.pause(); playBtn.textContent = "▶"; }
}
audioEl.addEventListener("play", ()=>{
const tv = document.getElementById("tvVideo");
if(tv && !tv.muted){ tv.muted = true; document.getElementById("tvSom").textContent = "🔇"; }
});
