<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagosta Filmes</title>

<link rel="icon" href="/favicon.ico">

<style>
body{
  margin:0;
  background:#A5C7F9;
  font-family: Arial, sans-serif;
}
main{
  max-width:720px;
  margin:40px auto;
  display:grid;
  gap:30px;
}
.box{
  background:#fff;
  border:1px solid #000;
  box-shadow:2px 2px 0 rgba(0,0,0,.4);
  padding:14px;
}
header{
  text-align:center;
}
header img{
  max-width:300px;
}
.fm-title{
  font-weight:bold;
  color:#7a0000;
}
.status{
  float:right;
  font-size:12px;
}
.player button{
  width:100%;
  padding:10px;
  background:#7a0000;
  color:#fff;
  border:none;
  font-weight:bold;
}
.bar{
  height:6px;
  background:#d00;
  margin-top:6px;
}
.fill{
  height:100%;
  background:#fff;
  width:0%;
}
.chat{
  background:#111;
  color:#00e060;
  font-family: monospace;
  padding:10px;
  margin-top:10px;
}
.log{
  max-height:120px;
  overflow:auto;
  border:1px solid #00e060;
  padding:6px;
}
input,button.send{
  width:100%;
  padding:6px;
  margin-top:6px;
  font-family: monospace;
}
button.send{
  background:#00e060;
  border:none;
}
footer{
  text-align:center;
  font-size:13px;
}
</style>
</head>

<body>
<main>

<header class="box">
  <img src="logo-lagosta-filmes.png"><br>
  <img src="poster-fortown.png" style="max-width:100%;margin-top:10px">
</header>

<!-- EP 02 -->
<section class="box">
  <div class="fm-title">LAGOSTA FM — EPISÓDIO PILOTO 02 <span class="status">ON AIR</span></div>

  <div class="player">
    <button onclick="toggle('ep02')">PLAY / PAUSE</button>
    <div class="bar"><div class="fill" id="fill_ep02"></div></div>
    <audio id="audio_ep02" src="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-02.mp3?alt=media"></audio>
  </div>

  <div class="chat">
    <div class="log" id="log_ep02"></div>
    <input id="input_ep02" placeholder="digite sua mensagem">
    <button class="send" onclick="send('ep02')">ENVIAR</button>
  </div>
</section>

<!-- EP 01 -->
<section class="box">
  <div class="fm-title">LAGOSTA FM — EPISÓDIO PILOTO <span class="status">ARQUIVO</span></div>

  <div class="player">
    <button onclick="toggle('ep01')">PLAY / PAUSE</button>
    <div class="bar"><div class="fill" id="fill_ep01"></div></div>
    <audio id="audio_ep01" src="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-piloto.mp3?alt=media"></audio>
  </div>

  <div class="chat">
    <div class="log" id="log_ep01"></div>
    <input id="input_ep01" placeholder="digite sua mensagem">
    <button class="send" onclick="send('ep01')">ENVIAR</button>
  </div>
</section>

<footer class="box">
  oi@lagostafilmes.com<br>
  insta: @lagosta.filmes
</footer>

</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyD4tr7eZNSvs3z49ROibvM48mjEZLCImZo",
  databaseURL: "https://lagosta-fm-default-rtdb.firebaseio.com"
});
const db = firebase.database();

function toggle(id){
  const a=document.getElementById("audio_"+id);
  a.paused?a.play():a.pause();
}
["ep01","ep02"].forEach(id=>{
  const a=document.getElementById("audio_"+id);
  const f=document.getElementById("fill_"+id);
  a.ontimeupdate=()=>f.style.width=(a.currentTime/a.duration*100||0)+"%";
  db.ref("messages_"+id).on("value",s=>{
    const log=document.getElementById("log_"+id);
    log.innerHTML="";
    Object.values(s.val()||{}).forEach(m=>{
      log.innerHTML+=`<div>[${m.t}] ${m.text}</div>`;
    });
    log.scrollTop=log.scrollHeight;
  });
});
function send(id){
  const i=document.getElementById("input_"+id);
  if(!i.value.trim())return;
  db.ref("messages_"+id).push({
    text:i.value,
    t:new Date().toLocaleTimeString()
  });
  i.value="";
}
</script>

</body>
</html>
