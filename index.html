const horaTeste = new URLSearchParams(location.search).get("hora");
if(local && horaTeste){
const [a,b,c] = horaTeste.split(":").map(Number);
const hoje = TV_INICIO + Math.floor((Date.now() - TV_INICIO)/DIA)*DIA;
desvio = hoje + ((a||0)*3600 + (b||0)*60 + (c||0))*1000 - Date.now();
// &dia=0 (domingo) … 6 (sábado): pula pro próximo dia da semana desse número
const diaTeste = new URLSearchParams(location.search).get("dia");
if(diaTeste !== null) desvio += ((Number(diaTeste) - Math.floor((Date.now() - TV_INICIO)/DIA) % 7 + 7) % 7) * DIA;
}
const relogio = ()=> Date.now() + desvio;
const msDoDia = t => (((t - TV_INICIO) % DIA) + DIA) % DIA;
const diaCurto = d => { const [a,m,dd] = String(d).split("-"); return dd && m ? dd + "/" + m : ""; };

// as sessões que existem (as que têm vídeo), com início e duração
const sessoes = TV_SESSOES.map(s=>{
const [h,m] = s.hora.split(":").map(Number);
const base = {...s, ini: (h*60 + m)*60000};
if(s.ep){
const ep = epDaTv();
if(!ep) return null;
return {...base, ep, video: ep.video, nome: "lagosta fm " + diaCurto(ep.data), duracao: ep.duracao || 7200};
}
if(s.lista){
const itens = grade.filter(g => g.fonte === s.lista);
return itens.length ? {...base, itens, nome: s.titulo, duracao: itens.reduce((t,g)=>t + g.duracao, 0)} : null;
}
const video = s.video || (local ? TV_SESSOES_TESTE[s.id] : "");
return video ? {...base, video, nome: s.titulo} : null;
}).filter(Boolean).sort((a,b)=>a.ini-b.ini);
const diaDe = t => Math.floor((t - TV_INICIO)/DIA);   // o canal entrou no ar num domingo: dia % 7 é o dia da semana
// o rodízio da noite: uma sessão por semana; a semana vira no sábado
const noites = sessoes.filter(s => s.noite);
const daSemana = (s, dia) => !s.noite || noites.length < 2 || noites[Math.floor((dia + 1)/7) % noites.length] === s;
const doDia = (s, dia) => !s.dias || s.dias.includes(((dia % 7) + 7) % 7);
// a sessão vale pelo dia em que começa
const vale = (s, dia) => !s.fora && daSemana(s, dia) && doDia(s, dia);
// numa sessão de lista: qual trecho e em que segundo dele
function pontoDaSessao(s, seg){
if(!s.itens) return {video: s.video, seg};
for(const g of s.itens){
if(seg < g.duracao) return {video: g.video, seg, falta: g.duracao - seg};
seg -= g.duracao;
}
const u = s.itens[s.itens.length - 1];
return {video: u.video, seg: u.duracao};
}

// embaralho com semente: o mesmo dia dá sempre a mesma ordem
function sorteio(semente){
let x = semente >>> 0 || 1;
return ()=>{ x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };
}
function ordemDoDia(dia){
const r = sorteio(dia * 2654435761);
// trechos com o mesmo "par" viram um bloco só, que passa inteiro e em ordem
const blocos = [], pares = {};
grade.forEach(g=>{
if(g.par){ if(!pares[g.par]){ pares[g.par] = []; blocos.push(pares[g.par]); } pares[g.par].push(g); }
else blocos.push([g]);
});
const porFonte = {};
blocos.forEach(b => (porFonte[b[0].fonte || "-"] ||= []).push(b));
const filas = Object.values(porFonte).map(f=>{
f = f.slice();
for(let i=f.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [f[i],f[j]] = [f[j],f[i]]; }
return f;
});
// entremeia: cada fonte se espalha por igual ao longo do dia
// (se tem muito mais carro que bike, os de bike aparecem distribuídos no meio)
const marcados = [];
filas.forEach(f=>{
const desloc = r();
f.forEach((g,k)=>marcados.push({g, chave:(k + desloc)/f.length}));
});
return marcados.sort((a,b)=>a.chave-b.chave).flatMap(m=>m.g);
}

// o que está passando neste instante: qual trecho e em que segundo dele
function noAr(t){
const dia = Math.floor((t - TV_INICIO)/DIA);
const ordem = ordemDoDia(dia);
let pos = (((t - TV_INICIO) % DIA)/1000) % total;
if(pos < 0) pos += total;
for(let i=0;i<ordem.length;i++){
if(pos < ordem[i].duracao) return {ordem, i, g: ordem[i], seg: pos, falta: ordem[i].duracao - pos};
pos -= ordem[i].duracao;
}
return {ordem, i:0, g: ordem[0], seg:0, falta: ordem[0].duracao};
}


// a sessão que está passando neste instante (ou nenhuma)
function sessaoEm(t){
const ms = msDoDia(t), dia = diaDe(t);
for(const s of sessoes){
// fora = o vídeo não abriu (direitos, apagado): volta a programação normal
const pos = (ms - s.ini + DIA) % DIA;
if(pos < s.duracao*1000 && vale(s, ms >= s.ini ? dia : dia - 1)) return {sessao: s, seg: pos/1000, falta: s.duracao - pos/1000};
}
return null;
}
// de madrugada o canal dorme: quantos segundos faltam pra acordar (0 = acordado)
const horaMs = h => { const [a,b] = h.split(":").map(Number); return (a*60 + b)*60000; };
const dormeIni = horaMs(TV_DORME[0]), dormeDur = (horaMs(TV_DORME[1]) - dormeIni + DIA) % DIA;
function dormindo(t){ const pos = (msDoDia(t) - dormeIni + DIA) % DIA; return pos < dormeDur ? (dormeDur - pos)/1000 : 0; }
// as aparições raras da semana: cada trecho raro passa uma vez, num instante sorteado (igual pra todo mundo),
// com o canal acordado e fora das sessões
const livre = t => !sessaoEm(t) && !dormindo(t);
const aparicoesDaSemana = {};
function aparicoes(sem){
if(aparicoesDaSemana[sem]) return aparicoesDaSemana[sem];
const r = sorteio((sem + 11) * 40503);
r(); r(); r();
const lista = [];
raros.forEach(g=>{
for(let k=0;k<60;k++){
const ini = TV_INICIO + sem*7*DIA + Math.floor(r()*7*DIA), fim = ini + g.duracao*1000;
if(livre(ini) && livre(fim) && !lista.some(a => ini < a.fim && fim > a.ini)){ lista.push({g, ini, fim}); break; }
}
});
return aparicoesDaSemana[sem] = lista.sort((a,b)=>a.ini - b.ini);
}
const semanaDe = t => Math.floor(diaDe(t)/7);
function raroEm(t){
if(!raros.length) return null;
for(const sem of [semanaDe(t) - 1, semanaDe(t)]) for(const a of aparicoes(sem)) if(t >= a.ini && t < a.fim) return a;
return null;
}
function ateORaro(t){
let m = Infinity;
if(raros.length) for(const sem of [semanaDe(t), semanaDe(t) + 1]) for(const a of aparicoes(sem)) if(a.ini > t) m = Math.min(m, (a.ini - t)/1000);
return m;
}

// o que passa neste instante: uma sessão, o canal dormindo, uma aparição rara ou um trecho da programação normal.
// a sessão entra sem aviso: nada de "a seguir" na tela nem na linha de baixo, e não existe grade pra consultar.
// ate = segundos até a próxima virada que não é fim de trecho (sessão, sono, aparição)
function estado(t){
const s = sessaoEm(t);
if(s) return s;
const ms = msDoDia(t), dia = diaDe(t);
let falta = Infinity;
sessoes.forEach(x=>{ const f = (x.ini - ms + DIA) % DIA; if(f < falta && vale(x, ms <= x.ini ? dia : dia + 1)) falta = f; });
let ate = falta/1000;
const sono = dormindo(t);
if(sono) return {dorme: true, ate: Math.min(ate, sono)};
ate = Math.min(ate, ((dormeIni - ms + DIA) % DIA)/1000 || Infinity, ateORaro(t));
const a = raroEm(t);
if(a) return {raro: a.g, seg: (t - a.ini)/1000, falta: (a.fim - t)/1000, ate};
return {trecho: noAr(t), ate};
}

/* --- a tela: um .mp4 no <video> ou um vídeo do youtube por cima --- */
let srcAtual = null, sessaoAtual = null, somTv = false;
let yt = null, ytId = null, ytPronto = false;
const ehYoutube = v => !/\.mp4($|\?)/.test(v);
function passar(video, seg){
if(ehYoutube(video)){
tv.pause(); tv.hidden = true; ytCaixa.hidden = false;
if(ytId !== video){
ytId = video; ytPronto = false; ytCaixa.innerHTML = "";
const d = document.createElement("div"); ytCaixa.append(d);
carregarYoutubeApi().then(YT=>{
if(ytId !== video) return;
yt = new YT.Player(d, {videoId: video, host: "https://www.youtube-nocookie.com",
playerVars: {mute:1, controls:0, disablekb:1, playsinline:1, rel:0, iv_load_policy:3, fs:0, start: Math.floor(seg)},
events: {
onReady(){ ytPronto = true; aplicarSom(); sintonizar(); },
onError(){ sessoes.forEach(s=>{ if(s.video === video) s.fora = true; }); ytId = null; yt = null; ytCaixa.innerHTML = ""; sintonizar(); }
}});
});
}else if(ytPronto){
if(Math.abs(yt.getCurrentTime() - seg) > 2) yt.seekTo(seg, true);
yt.playVideo();
}
}else{
if(ytId){ ytId = null; ytPronto = false; yt = null; ytCaixa.innerHTML = ""; }
ytCaixa.hidden = true;
if(srcAtual !== video){ srcAtual = video; tv.src = video; }
if(tv.readyState >= 1 && Math.abs(tv.currentTime - seg) > 2) tv.currentTime = seg;
tv.play().catch(()=>{});
tv.hidden = false;
}
semSinal.hidden = true; botaoSom.hidden = false;
}

/* --- a tela das sessões: carrega por cima, escondida, e só aparece quando tem imagem.
       quem chega no meio de uma sessão vê a programação seguir por uns segundos, não uma tela preta --- */
let srcSessao = null, revelada = false;
function passarSessao(video, seg){
if(srcSessao !== video){ srcSessao = video; tvS.src = video; }
if(tvS.readyState >= 1 && Math.abs(tvS.currentTime - seg) > 2) tvS.currentTime = seg;
// se o navegador não deixar tocar com som sem um clique, toca mudo (o botão "ligar o som" fica à vista)
tvS.play().catch(()=>{ if(!tvS.muted){ somTv = false; tvS.muted = true; pintarSom(); tvS.play().catch(()=>{}); } });
if(!revelada && tvS.readyState >= 3 && !tvS.seeking && Math.abs(tvS.currentTime - seg) <= 2) revelada = true;
tvS.classList.toggle("espera", !revelada);
if(revelada){ tv.pause(); ytCaixa.hidden = true; semSinal.hidden = true; botaoSom.hidden = false; }
}
function soltarSessao(){
if(!srcSessao) return;
srcSessao = null; revelada = false;
tvS.pause(); tvS.removeAttribute("src"); tvS.load();
tvS.classList.add("espera");
}
// o canal dormindo: nada passa, ficam as barras
function dormir(){
tv.pause(); tv.hidden = true; ytCaixa.hidden = true;
semSinal.hidden = false; botaoSom.hidden = true;
}

/* --- o som: no lagosta fm, o som é a rádio; no resto, o da própria tv --- */
const fmNoAr = ()=> !!(sessaoAtual && sessaoAtual.ep);
function aplicarSom(){
const ligado = somTv && !fmNoAr();
tv.muted = !(ligado && !revelada);
tvS.muted = !(ligado && revelada);
if(yt && ytPronto){ if(ligado) yt.unMute(); else yt.mute(); }
pintarSom();
}
function pintarSom(){
const ligado = fmNoAr() ? (som.tocando && som.ep === sessaoAtual.ep) : somTv;
botaoSom.textContent = ligado ? "🔊" : (sessaoAtual ? "🔇 ligar o som" : "🔇");
botaoSom.classList.toggle("desligado", !ligado);
botaoSom.setAttribute("aria-label", ligado ? "desligar o som" : (fmNoAr() ? "ouvir o lagosta fm" : "ligar o som"));
}
// liga a rádio no episódio que está na tv, no mesmo ponto
function radioNaTv(){
const s = sessaoAtual;
carregarEpisodio(s.ep, false);
if(window.moverRecados) window.moverRecados();
let tentativas = 40;
(function ir(){
const e = estado(relogio());
if(!e.sessao || e.sessao !== s) return;
if(som.dur){ som.ir(e.seg); som.tocar(); }
else if(tentativas-- > 0) setTimeout(ir, 250);
})();
}
window.tvCalar = ()=>{ if(somTv){ somTv = false; aplicarSom(); } };
window.tvAvisar = ()=>{ if(sessaoAtual) pintarSom(); };

/* --- a linha "agora" --- */
function hhmm(ms){ const m = Math.round(ms/60000) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }
function escrever(no, partes){
no.textContent = "";
partes.forEach(p => no.append(typeof p === "string" ? p : Object.assign(document.createElement("b"), {textContent: p.b})));
}
function escreverAgora(e){
if(e.sessao){
escrever(agoraEl, ["agora: ", {b: e.sessao.nome}, (e.sessao.de ? ", " + e.sessao.de : "") + (e.sessao.montagem ? " · montagem " + e.sessao.montagem : "") + " · até " + hhmm(e.sessao.ini + e.sessao.duracao*1000) + (fmNoAr() ? " · o som é a rádio" : "")]);
}else{
agoraEl.textContent = "";   // na programação normal a tela não diz o que é: só imagem
}
}

/* --- sintonizar: confere a cada virada (fim do trecho, começo e fim de sessão) e a cada 15 s --- */
let proximo = null;   // o próximo trecho, já carregando, pra troca não ter buraco
let timer = null;
function sintonizar(){
const e = estado(relogio());
const antes = sessaoAtual;
sessaoAtual = e.sessao || null;
// entrou no lagosta fm com o som da tv ligado: o som passa pra rádio
if(fmNoAr() && sessaoAtual !== antes && somTv){ somTv = false; radioNaTv(); }
const ponto = e.sessao ? pontoDaSessao(e.sessao, e.seg) : null;
if(ponto && !ehYoutube(ponto.video)){
passarSessao(ponto.video, ponto.seg);
// enquanto o vídeo da sessão carrega, a programação segue na tela
if(!revelada){ const tr = noAr(relogio()); passar(tr.g.video, tr.seg); }
}else{
soltarSessao();
if(ponto) passar(ponto.video, ponto.seg);
else if(e.dorme) dormir();
else if(e.raro) passar(e.raro.video, e.seg);
else passar(e.trecho.g.video, e.trecho.seg);
}
telaEl.classList.toggle("sessao", !!sessaoAtual);
telaEl.classList.toggle("escuro", !!(sessaoAtual && !sessaoAtual.ep));   // as luzes apagam
recadoForm.hidden = !(sessaoAtual && !sessaoAtual.ep);   // no lagosta fm, os recados são os do episódio
aplicarSom();
escreverAgora(e);
// o próximo trecho já vai carregando
if(e.trecho && e.trecho.falta < 12){
const prox = e.trecho.ordem[e.trecho.i + 1];
if(prox && (!proximo || proximo.dataset.src !== prox.video)){
proximo = document.createElement("video");
proximo.muted = true; proximo.preload = "auto"; proximo.dataset.src = prox.video; proximo.src = prox.video;
}
}
const viradas = [15];
if(e.sessao) viradas.push(e.falta, ponto.falta || 0);
else if(e.raro) viradas.push(e.falta);
else if(e.trecho) viradas.push(e.trecho.falta);
if(e.ate) viradas.push(e.ate);
if(e.sessao && !revelada) viradas.push(1);   // esperando a imagem da sessão: confere de novo logo
clearTimeout(timer);
timer = setTimeout(sintonizar, Math.max(0.3, Math.min(...viradas.filter(v => v > 0)) + 0.2) * 1000);
}

tv.addEventListener("loadedmetadata", sintonizar);
["loadedmetadata","canplay","seeked"].forEach(ev => tvS.addEventListener(ev, sintonizar));
// o .mp4 de uma sessão não abriu (tirado do ar, servidor fora): ela sai do ar e volta a programação normal
tvS.addEventListener("error", ()=>{
if(!srcSessao) return;
const caiu = sessoes.filter(s=>s.video && !s.fora && srcSessao === s.video);
if(!caiu.length) return;
caiu.forEach(s=>{ s.fora = true; });
soltarSessao(); sintonizar();
});
if(local){ window.tvEstado = ()=> estado(relogio()); window.tvSintonizar = sintonizar; window.tvAparicoes = (mais=0)=> aparicoes(semanaDe(relogio()) + mais).map(a => ({dia: diaDe(a.ini) % 7, hora: new Date(msDoDia(a.ini)).toISOString().slice(11,19), video: a.g.video})); }   // pra conferir no console
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) sintonizar(); });
sintonizar();

// clicar no vídeo também liga/desliga o som
let timerMostra = null;
document.getElementById("tvTela").addEventListener("click", e=>{
if(e.target !== botaoSom) botaoSom.click();
// no celular não tem "mouse em cima": mostra o botão por uns segundos
const t = document.getElementById("tvTela");
t.classList.add("mostra"); clearTimeout(timerMostra);
timerMostra = setTimeout(()=>t.classList.remove("mostra"), 2500);
});
botaoSom.addEventListener("click",()=>{
if(fmNoAr()){
if(som.tocando && som.ep === sessaoAtual.ep) som.pausar(); else radioNaTv();
}else{
somTv = !somTv;
if(somTv) calarRadio();
aplicarSom();
}
});

/* --- tela cheia: pra deixar ligado. entra com som e não deixa a tela apagar --- */
let trava = null;
function travarTela(){
if(document.fullscreenElement === telaEl && navigator.wakeLock && !document.hidden)
navigator.wakeLock.request("screen").then(w=>{ trava = w; }).catch(()=>{});
}
function telaCheia(){
if(document.fullscreenElement){ document.exitFullscreen(); return; }
if(fmNoAr()){ if(!(som.tocando && som.ep === sessaoAtual.ep)) radioNaTv(); }
else if(!somTv){ somTv = true; calarRadio(); aplicarSom(); }
if(telaEl.requestFullscreen) telaEl.requestFullscreen().catch(()=>{});
else if(telaEl.webkitRequestFullscreen) telaEl.webkitRequestFullscreen();
else if(tv.webkitEnterFullscreen) (revelada ? tvS : tv).webkitEnterFullscreen();   // iphone: só o vídeo vai pra tela cheia
}
document.getElementById("tvCheia").addEventListener("click", telaCheia);
document.addEventListener("fullscreenchange", ()=>{
if(document.fullscreenElement === telaEl) travarTela();
else if(trava){ trava.release().catch(()=>{}); trava = null; }
});
document.addEventListener("visibilitychange", travarTela);   // a trava cai quando a aba some; volta com ela

/* --- recados da sessão: ficam presos no ponto em que foram deixados e passam na tela
       toda vez que a sessão chega ali (como os comentários do rádio). no banco, ep = "tv-" + id da sessão --- */
const recadosEl = document.getElementById("tvRecados");
const campoRecado = document.getElementById("tvRecado");
const tvNick = document.getElementById("tvNick");
const naTela = new Set();
function mostrarRecado(m){
const k = m.at + "|" + m.text;
if(naTela.has(k)) return;
naTela.add(k);
const d = document.createElement("div");
d.className = "tv-diz";
d.append(Object.assign(document.createElement("b"), {textContent: (m.nick || "ouvinte") + ": "}), String(m.text));
recadosEl.append(d);
while(recadosEl.children.length > 4) recadosEl.firstChild.remove();
setTimeout(()=>{ d.remove(); naTela.delete(k); }, 7000);
}
const sessaoDeRecado = ()=> sessaoAtual && !sessaoAtual.ep ? sessaoAtual : null;
// a cada segundo: os recados que caem no trecho que acabou de passar
let ultimoSeg = -1;
setInterval(()=>{
const s = sessaoDeRecado();
const e = s && !document.hidden ? estado(relogio()) : null;
if(!e || e.sessao !== s){ ultimoSeg = -1; return; }
if(ultimoSeg >= 0 && e.seg > ultimoSeg && e.seg - ultimoSeg < 5)
messages.filter(m => m.ep === "tv-" + s.id && m.tAudio > ultimoSeg && m.tAudio <= e.seg).forEach(mostrarRecado);
ultimoSeg = e.seg;
}, 1000);
// recado de outra pessoa, mandado agora: aparece na hora
window.tvRecadoChegou = m=>{
const s = sessaoDeRecado();
if(s && m.ep === "tv-" + s.id && Date.now() - m.at < 20000) mostrarRecado(m);
};
// o nome é o mesmo dos comentários
tvNick.value = nickInput.value;
tvNick.addEventListener("input", ()=>{ nickInput.value = tvNick.value; });
nickInput.addEventListener("input", ()=>{ tvNick.value = nickInput.value; });
recadoForm.addEventListener("submit", ev=>{
ev.preventDefault();
const s = sessaoDeRecado(), txt = campoRecado.value.trim();
if(!s || !txt) return;
const e = estado(relogio());
if(e.sessao !== s) return;
const agora = new Date();
const m = {text: txt, tAudio: Math.round(e.seg*10)/10, at: agora.getTime(), atHour: agora.getHours(), atMin: agora.getMinutes(), nick: nomeAtual(), ep: "tv-" + s.id};
messages.push(m);
saveLocalMessages(messages);
sendToFirebase(m);
campoRecado.value = "";
mostrarRecado(m);
});
})();

// tv e rádio não falam ao mesmo tempo: quem liga o som cala o outro
function calarRadio(){
if(som.tocando) som.pausar();
}
function calarTv(){
if(window.tvCalar) window.tvCalar();
}
