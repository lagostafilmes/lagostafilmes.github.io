<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lagosta Filmes</title>
<meta name="description" content="Lagosta Filmes. Produtora de filmes e outras coisas. Fortaleza, CE.">
<!-- o cartão que aparece quando o link é colado no whatsapp, no instagram etc. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lagosta Filmes">
<meta property="og:title" content="Lagosta Filmes">
<meta property="og:description" content="produtora de filmes e outras coisas. fortaleza, ce.">
<meta property="og:url" content="https://www.lagostafilmes.com/">
<meta property="og:image" content="https://www.lagostafilmes.com/capa.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Favicon Lagosta Filmes -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#A5C7F9">
<meta name="color-scheme" content="light">
<!-- a página tem uma cor só; pede às extensões de modo escuro (Dark Reader) que não a repintem -->
<meta name="darkreader-lock">

<style>
/* Layout: uma página branca de 660px sobre o azul-céu, como um fotolog de 2005 —
   o nome com o status (no ar, ouvindo), a foto do dia (uma tira de super 16), a legenda,
   e os comentários dos amigos, "fulano diz:". Tahoma 11px, links azuis, regras cinza. */
:root{
  --ceu:#BCD4EE;       /* o fundo: um céu mais calmo */
  --branco:#FBF4E4;    /* a página: papel */
  --moldura:#D6C39A;   /* a borda da página */
  --texto:#222018;
  --cinza:#867A62;     /* datas, legendas */
  --regra:#E8DBBE;     /* as linhas */
  --link:#2B4FA8;
  --vermelho:#D23B2C;  /* o vermelho do logo */
  --online:#3DB54A;    /* o verdinho de "online" */
  --campo:#C4B08A;     /* borda de campo de texto */
  --faixa:#FBD899;     /* o creme do logo (o mesmo do avatar do insta): cabeçalho e status */
  --fonte:Tahoma,Verdana,"Segoe UI","DejaVu Sans",sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html{background:var(--ceu) url(bg-lagosta.svg)}  /* o céu com as lagostinhas: em cima e em duas faixas finas dos lados */
body{
  margin:0;
  background:transparent;
  color:var(--texto);
  font:12px/1.55 var(--fonte);
  padding:0 clamp(10px,3vw,40px);
}
img{max-width:100%}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:1px dotted var(--texto);outline-offset:2px}

/* ---------- a página ---------- */
.pagina{background:transparent}
/* o miolo fica numa coluna central; o papel vai até a borda */
/* tudo numa coluna só: a tv, o feed com a lateral e o rodapé têm as mesmas bordas */
/* a lâmina: papel largo, o céu só emoldura */
.corpo,.rodape{background:var(--branco);border-left:1px solid var(--moldura);border-right:1px solid var(--moldura)}
.corpo{border-top:1px solid var(--moldura);border-bottom:1px solid var(--moldura);margin-bottom:clamp(10px,3vw,40px)}
/* como no substack: a tv em cima, ocupando tudo; embaixo o feed e uma coluna estreita à direita */
.corpo > main{max-width:1080px;margin:0 auto;padding:0 26px;display:grid;grid-template-columns:minmax(0,1fr) 270px;column-gap:48px}
.corpo > main > #tvCanto{grid-column:1/-1}
.corpo > main > #feed,.corpo > main > #post{grid-column:1;grid-row:2}
.coluna{grid-column:2;grid-row:2;align-self:start;position:sticky;top:20px;padding:30px 0}
.coluna p{margin:8px 0 0;color:var(--cinza)}
.coluna-marca{display:block;transform:rotate(-8deg)}
.coluna-nome{font:bold 20px/1.2 Georgia,"Times New Roman",serif;margin:0;color:var(--texto)}
.coluna .assina{display:flex;flex-direction:column;gap:8px;margin:18px 0 4px;padding-top:16px;border-top:1px solid var(--regra)}
/* o nome do bloco da newsletter: separado do "quem é" por uma linha, pra não parecer continuação dele */
.assina-nome{font-weight:bold;color:var(--texto)}
.coluna .msg-field{padding:8px 10px;font-size:12px;width:100%}
.inscrever{
  font:bold 13px/1 var(--fonte);color:var(--branco);background:var(--vermelho);
  border:0;border-radius:4px;padding:11px 14px;cursor:pointer;
}
.inscrever:hover{filter:brightness(1.08)}
/* cada post numa linha: texto à esquerda, miniatura à direita */
#feed .item,#post .item{display:grid;grid-template-columns:minmax(0,1fr) 170px;column-gap:24px;padding:26px 0;border-bottom:1px solid var(--regra)}
.item .legenda{padding:0;grid-column:1;grid-row:1}
#feed .item.sem-mini,#post .item.sem-mini{grid-template-columns:minmax(0,1fr)}
.miniatura{grid-column:2;grid-row:1;align-self:start;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.miniatura img{width:100%;height:100%;object-fit:cover;display:block}
/* a foto do dia: a linha de cima (foto, data) e a imagem inteira embaixo, na largura da coluna */
#feed .item.so-foto{grid-template-columns:minmax(0,1fr);row-gap:10px}
.so-foto .miniatura{grid-column:1;grid-row:2;aspect-ratio:auto;background:none;border:1px solid var(--texto);box-shadow:3px 3px 0 var(--moldura)}
.so-foto .miniatura img{height:auto;object-fit:contain}
.miniatura.t-episodio,.miniatura.t-texto,.miniatura.t-nota,.miniatura.t-links,.miniatura.t-indica{background:var(--faixa);border:1px solid var(--moldura);box-shadow:2px 2px 0 var(--moldura)}
.mini-nome{font:bold 18px/1.1 Georgia,"Times New Roman",serif;color:var(--vermelho);text-align:center;padding:0 10px;transform:rotate(-4deg)}

/* o nome */
.cabeca{
  background:transparent;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:22px 16px 18px;
}
.cabeca .marca{display:block;width:150px;background:var(--faixa);padding:10px 14px;border:1px solid var(--moldura);box-shadow:2px 2px 0 var(--moldura);box-sizing:content-box;line-height:0;transform:rotate(-2deg)}
.cabeca .marca img{width:100%;height:auto;display:block}
.cabeca .lugar{color:var(--cinza);padding-bottom:2px;text-align:center}
/* o mascote: a cara da lagosta, um selinho meio torto */
.mascote{position:absolute;top:12px;right:14px;border:1px solid var(--moldura);transform:rotate(6deg)}
.fim{padding:22px 16px 26px;text-align:center;color:var(--cinza)}
.fim img{display:block;margin:0 auto;width:78px;height:auto;transform:rotate(-14deg)}

/* a rádio: bloco da lateral, irmão da tv */
.radio-topo{display:flex;align-items:baseline;justify-content:space-between}
.radio-topo b{font-size:12px}
.radio .no-ar{color:var(--cinza);font-size:10px}
.radio .no-ar::before,.tv-palco .no-ar::before{width:6px;height:6px;margin-right:4px;vertical-align:0}
.radio{margin:8px 0 2px}
.radio-linha{display:flex;align-items:center;gap:10px;margin:0 0 6px}
/* o player fica num campo de cor chapada (como o intervalo do obs); a cor troca a cada faixa */
.radio{padding:12px 14px 10px;transition:background-color 1.2s linear}
.radio.c-ceu{background:var(--ceu)}
.radio.c-faixa{background:var(--faixa)}
.radio.c-campo{background:var(--campo)}
.radio.c-campo .onda i:not(.tocou){background:var(--branco)}
/* o anel: o texto gira em volta do play enquanto toca */
.anel-play{position:relative;flex:none;width:84px;height:84px;display:grid;place-items:center}
.anel{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:gira 40s linear infinite;animation-play-state:paused}
.radio.tocando .anel{animation-play-state:running}
.anel text{font:10px var(--fonte);fill:var(--texto);letter-spacing:.5px}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.anel{animation:none}}
/* a tracklist */
.faixas{list-style:none;margin:8px 0 0;padding:0;font-size:11px;max-height:190px;overflow:auto}
.faixas li{padding:2px 0;cursor:pointer;border-top:1px solid rgba(34,32,24,.12)}
.faixas li:hover{text-decoration:underline}
.faixas li.agora{font-weight:bold}
.faixas .quando{color:var(--texto);opacity:.6;font-variant-numeric:tabular-nums;display:inline-block;min-width:44px}
.mixcloud{margin-top:8px;line-height:0}
.mixcloud iframe{width:100%;height:60px;border:0}
/* a cena: a câmera do canto (muda) e, por cima, os cantos do obs */
.cena{position:relative;aspect-ratio:16/9;background:#111;margin:0 0 12px;overflow:hidden;border:1px solid var(--texto);box-shadow:3px 3px 0 var(--moldura)}
.cena-camera,.cena-camera > *{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.cena-camera{pointer-events:none}
.cena-marca{position:absolute;left:12px;top:9px;color:var(--vermelho);font:bold 12px/1 var(--fonte)}
.cena-setlist{position:absolute;left:12px;bottom:12px;width:16%;padding:0;border:0;background:none;cursor:zoom-in;transform:rotate(-3deg);transform-origin:bottom left;transition:width .3s}
.cena-setlist img{display:block;width:100%;box-shadow:1px 1px 3px rgba(0,0,0,.5)}
.cena-setlist.aberta{width:42%;cursor:zoom-out}
.cena-janela{position:absolute;right:12px;top:9px;width:22%;aspect-ratio:16/9;border:1px solid var(--branco);background:#000;line-height:0}
.cena-janela video{width:100%;height:100%;object-fit:cover}
.cena-janela[hidden],.cena-setlist[hidden],.cena-faixa[hidden]{display:none}
.cena-faixa{position:absolute;right:12px;bottom:9px;max-width:55%;font:11px/1.3 var(--fonte);color:var(--branco);background:none;border:0;padding:0;text-align:right;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.cena-faixa:hover{text-decoration:underline}
.radio.so-mixcloud .cena{display:none}
/* o vídeo do obs já vem com os cantos desenhados: aqui não repete */
.cena.gravada .cena-marca,.cena.gravada .cena-setlist,.cena.gravada .cena-janela,.cena.gravada .cena-faixa{display:none}
@media (max-width:480px){
  .cena-janela{display:none}
  .cena-setlist{width:22%}
  .cena-faixa{font-size:10px}
}
/* quando o mixcloud não aceita o nosso botão: só o player deles, a tracklist vira lista */
.radio.so-mixcloud .radio-linha{display:none}
.radio.so-mixcloud .mixcloud{margin-top:0}
.radio.so-mixcloud .faixas li{cursor:default}
.radio.so-mixcloud .faixas li:hover{text-decoration:none}
/* "ouvir": nos episódios que não estão no player */
.ouvir{font:12px var(--fonte);color:var(--link);background:none;border:0;padding:0;margin-top:8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.ouvir:hover{text-decoration:underline}
.ouvir[hidden]{display:none}
.ouvir-play{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--vermelho);color:var(--branco);font-size:8px;line-height:20px;text-align:center;padding-left:1px}
.play{
  flex:none;
  position:relative;
  width:40px;height:40px;
  border-radius:50%;
  border:0;
  background:var(--vermelho);
  color:var(--branco);
  font:13px/1 var(--fonte);
  cursor:pointer;
  padding:0 0 0 2px;
}
.play:hover{filter:brightness(1.08)}
.radio-ep{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.radio .tempos{margin-left:auto}
.radio .barra{height:30px;touch-action:none}
.barra.buscando .onda i.tocou{opacity:.6}
.radio .marker-bubble{max-width:190px;white-space:normal}

/* o status: no ar, ouvindo */
.status{
  background:var(--faixa);
  border-top:1px solid rgba(0,0,0,.08);
  border-bottom:1px solid var(--regra);
  padding:7px 16px 8px;
}
.status-linha{
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  align-items:baseline;
}
.no-ar{white-space:nowrap}
.no-ar::before{
  content:"";
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--online);
  border:1px solid #2E8F3A;
  margin-right:5px;
  vertical-align:-1px;
  animation:pisca 2.4s steps(1) infinite;  /* a bolinha de "online" pisca devagar */
}
@keyframes pisca{50%{opacity:.25}}
.ouvindo{color:var(--texto)}
.visor{
  margin-top:3px;
  font:bold 13px/1.3 Georgia,"Times New Roman",serif;
  color:var(--vermelho);
}
.visor .obs{font:11px var(--fonte);color:var(--cinza);margin-left:4px}
.ouvindo .nota{color:var(--cinza);margin-right:3px}
.controles{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-top:6px;
}
.botao{
  flex:none;
  font:11px/1 var(--fonte);
  color:var(--texto);
  background:linear-gradient(#FDFDFD,#E3E3E3);
  border:1px solid #7A7A7A;
  border-radius:3px;
  padding:4px 10px;
  min-width:52px;
  cursor:pointer;
}
.botao:hover{background:linear-gradient(#FFFFFF,#EDEDED)}
.botao:active{background:#DCDCDC}
/* a barra é uma onda (como no soundcloud): barrinhas cinza, vermelhas onde já tocou */
.barra{
  flex:1;
  min-width:0;
  position:relative;
  height:26px;
  cursor:pointer;
}
.progress-bar-fill{display:none}
.onda{display:flex;align-items:flex-end;gap:1px;height:100%;overflow:hidden}
.onda i{flex:1;background:var(--campo);opacity:.55;min-width:1px}
.onda i.tocou{background:var(--vermelho);opacity:1}
/* cada recado é um risquinho na onda: só aparece quando o recado está em foco
   (passando o mouse no comentário, ou quando o áudio passa por ele) */
.comment-marker{
  position:absolute;
  top:-3px;
  width:2px;height:32px;
  margin-left:-1px;
  background:var(--texto);
  display:none;
  pointer-events:none;
}
.comment-marker.agora{display:block}
.diz{cursor:default}
.diz:hover .nick{color:var(--vermelho)}
.marker-bubble{
  position:absolute;
  left:0;
  bottom:34px;
  background:var(--branco);
  color:var(--texto);
  border:1px solid var(--moldura);
  box-shadow:1px 1px 0 var(--moldura);
  font:10px/1.3 var(--fonte);
  padding:2px 5px;
  white-space:nowrap;
  display:none;
  pointer-events:none;
  max-width:240px;
  overflow:hidden;
  text-overflow:ellipsis;
  z-index:10;
}
.tempos{
  flex:none;
  font-size:10px;
  color:var(--cinza);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
audio{display:none}

/* ---------- a foto do dia ---------- */
.foto{padding:20px 16px 4px;position:relative}
/* a foto colada meio torta, com um pedaço de fita crepe em cima */
.imagem{
  display:block;
  width:100%;
  height:auto;
  border:6px solid #FFFDF7;
  box-shadow:1px 2px 4px rgba(0,0,0,.25);
  transform:rotate(-.7deg);
}
.foto::before{
  content:"";
  position:absolute;
  top:10px;left:50%;
  width:90px;height:22px;
  margin-left:-45px;
  background:rgba(240,228,190,.85);
  box-shadow:0 1px 1px rgba(0,0,0,.12);
  transform:rotate(2.5deg);
  z-index:1;
}
.legenda{padding:16px 26px 20px}  /* mesma margem da tv, pra alinhar */
.legenda-linha{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.legenda-linha b{font-size:12px}
.legenda-linha .data{color:var(--cinza);white-space:nowrap}
.legenda p{margin:2px 0 0}
.legenda .meta{color:var(--cinza);margin-top:4px}

.legenda #postTexto p{margin:2px 0 0}
.legenda #postTexto p+p{margin-top:8px}
.rascunho{color:var(--vermelho);font-weight:bold;margin-left:6px}

/* ---------- corpo: feed à esquerda, a produtora à direita ---------- */
.corpo{display:block}
.bloco{padding:8px 14px 10px;border-bottom:1px solid var(--regra)}
.bloco b{font-size:12px}
.bloco p{margin:4px 0 0}
.bloco ul{margin:4px 0 0;padding:0;list-style:none}
.bloco li{margin:3px 0}
.obs{color:var(--cinza);font-size:10px}
.assina{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.assina .botao{align-self:flex-start}

/* ---------- lagosta tv: o palco da home, uma faixa escura com a tela grande ---------- */
.tv-palco{padding:30px 0 28px;border-bottom:1px solid var(--regra)}
.tv{
  position:relative;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  border:1px solid var(--texto);
  box-shadow:3px 3px 0 var(--moldura);
}
.tv video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.tv .tv-sessao{position:absolute;inset:0;z-index:0}
.tv .tv-sessao.espera{opacity:0;pointer-events:none}
.tv::after{  /* as linhas da tela, bem de leve */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);
}
.sem-sinal{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,#BFBFBF 0 14.3%,#BFBF3C 0 28.6%,#3CBFBF 0 42.9%,#3CBF3C 0 57.1%,#BF3CBF 0 71.4%,#BF3C3C 0 85.7%,#3C3CBF 0);
}
.sem-sinal span{background:#111;color:#EEE;font:bold 11px/1 var(--fonte);letter-spacing:1px;padding:4px 8px;text-transform:uppercase}
.tv [hidden]{display:none}
.tv{cursor:pointer}
/* o botão de som fica no canto do vídeo, como num player */
.tv-som{
  position:absolute;left:12px;bottom:12px;z-index:3;
  width:28px;height:28px;border-radius:50%;border:0;
  background:rgba(20,18,14,.35);color:#fff;font-size:12px;line-height:28px;padding:0;cursor:pointer;
  filter:grayscale(1);
}
.tv-som:hover{background:rgba(20,18,14,.55)}
/* o botão só aparece com o mouse em cima do vídeo (no celular, uns segundos depois de tocar) */
.tv-som{opacity:0;transition:opacity .2s}
.tv:hover .tv-som,.tv-som:focus-visible,.tv.mostra .tv-som{opacity:.75}
/* a marca da lagosta no canto da tela, como selo de emissora */
.tv-marca{position:absolute;bottom:4%;right:2.5%;width:7%;min-width:28px;z-index:2;opacity:.9;pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.tv-barra{
  margin:10px 0 0;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--texto);
}
.tv-nome{font-size:12px}
.tv-palco .no-ar{color:var(--cinza);font-size:10px;margin-right:4px}
.tv-botoes{display:flex;gap:6px}
.tv-botao{
  font:11px/1 var(--fonte);color:var(--texto);background:transparent;
  border:1px solid var(--campo);padding:5px 9px;cursor:pointer;
}
.tv-botao:hover{border-color:var(--texto)}
/* a sessão no youtube ocupa a tela inteira, sem controles: quem manda é o relógio */
.tv-yt,.tv-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
/* a linha de baixo da tv: o nome da sessão, quando é uma sessão. o resto do dia é só imagem, sem nome, sem grade, sem "a seguir" */
.tv-agora{font-size:11px;color:var(--cinza);min-width:0}
.tv-agora b{color:var(--texto)}
.tv-botoes{align-items:center}
.tv-vendo{font-size:10px;color:var(--cinza);margin-right:4px}
/* numa sessão, com o som desligado, o botão fica à vista e diz o que faz */
.tv.sessao .tv-som.desligado{opacity:.9;width:auto;padding:0 10px;border-radius:14px;font:11px/28px var(--fonte)}
/* os recados da sessão, por cima da imagem, uns segundos cada */
.tv-recados{position:absolute;left:12px;right:18%;bottom:48px;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
.tv-diz{background:rgba(20,18,14,.6);color:#fff;font:11px/1.35 var(--fonte);padding:3px 7px;max-width:100%;overflow-wrap:anywhere}
.tv-recado{display:flex;gap:6px;margin-top:8px}
.tv-recado[hidden]{display:none}
.tv-recado .msg-field{flex:1;min-width:0}
/* as luzes apagam: numa sessão (menos o lagosta fm, que é de manhã) o resto da página escurece em volta da tela,
   como sala de cinema, e volta quando a sessão acaba. é uma sombra enorme da própria tela: não cobre clique nenhum */
.tv{box-shadow:3px 3px 0 var(--moldura),0 0 0 200vmax rgba(12,14,24,0);transition:box-shadow 4s ease}
.tv.escuro{z-index:5;border-color:#000;box-shadow:3px 3px 0 transparent,0 0 0 200vmax rgba(12,14,24,.62)}
@media (prefers-reduced-motion:reduce){.tv{transition:none}}
/* tela cheia: pra deixar ligado */
.tv:fullscreen{border:0;box-shadow:none;aspect-ratio:auto;width:100vw;height:100vh}
.tv:fullscreen .tv-diz{font-size:16px;padding:5px 10px}

/* ---------- o feed: cada post do seu jeito ---------- */
.item{border-bottom:1px solid var(--regra);padding-bottom:4px}
.tipo{
  display:inline-block;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--faixa);
  background:var(--texto);
  padding:1px 4px;
  margin-right:6px;
  vertical-align:1px;
}
.tipo.t-episodio{background:var(--vermelho)}
.tipo.t-texto{background:var(--link)}
.item .titulo-texto{
  display:block;
  font:bold 17px/1.25 Georgia,"Times New Roman",serif;
  color:var(--texto);
  margin:4px 0 2px;
}
.item .ler{font-weight:bold}
.legenda-linha a.data{color:var(--cinza)}
.legenda-linha a.nome-data{color:var(--texto);font:bold 22px/1.2 Georgia,"Times New Roman",serif}
.nota-txt p{margin:4px 0 0;font-size:12px}
.tipo.t-nota{background:var(--cinza)}
.tipo.t-indica{background:#3E7A4F}
.voltar{padding:10px 16px 0}

/* ---------- modo leitura: letra grande, coluna estreita ---------- */
.leitura{padding:6px 16px 18px}
.leitura h1{font:bold 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px;color:var(--texto)}
.leitura .data{color:var(--cinza)}
.leitura .prosa{max-width:34em;margin-top:14px}
.leitura .prosa p{font:16px/1.7 Georgia,"Times New Roman",serif;margin:0 0 1em}
.leitura .prosa h2{font:bold 18px/1.3 Georgia,"Times New Roman",serif;margin:1.6em 0 .5em}
.leitura .prosa blockquote{font:italic 18px/1.5 Georgia,"Times New Roman",serif;color:var(--vermelho);border-left:3px solid var(--vermelho);margin:1.2em 0;padding:0 0 0 14px}
.links{margin:8px 0 2px;padding-left:20px}
.links li{margin:0 0 9px;font-size:12px}
.links li a{font-weight:bold}
.tipo.t-links{background:#6B4E8A}
/* a newsletter da semana, que anda junto com o episódio (no código, tipo "carta") */
.na-carta{margin:6px 0 0;font-size:11px;color:var(--cinza)}
.na-carta a{color:var(--link)}
.carta-pe{max-width:34em;border-top:1px solid var(--regra);margin-top:20px;padding-top:10px;font-size:12px;color:var(--cinza)}
.carta-pe p{margin:0 0 6px}
.cartas{list-style:none;margin:14px 0 0;padding:0;max-width:34em}
.cartas li{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--regra);padding:7px 0}
.cartas .num{color:var(--cinza);font-size:10px;min-width:58px}
.cartas a{font:bold 15px/1.3 Georgia,"Times New Roman",serif;color:var(--texto)}
.cartas .assuntos{display:block;font:11px var(--fonte);color:var(--cinza);margin-top:2px}

/* ---------- os comentários ---------- */
.comentarios{
  border-top:1px solid var(--regra);
  padding:10px 16px 14px;
}
.comentarios-cab{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.comentarios-cab b{font-size:12px}
summary.comentarios-cab{display:list-item;cursor:pointer;color:var(--link)}
summary.comentarios-cab b{font-size:11px}
details.comentarios{border-top:0;padding:4px 0 6px}
.comentarios-cab .quantos{color:var(--cinza)}
.chat-log{margin-top:6px}
.diz{
  padding:7px 0;
  border-top:1px solid var(--regra);
}
.diz:first-child{border-top:0}
.diz-cab{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.diz-cab .nick{font-weight:bold}
.diz-cab .hora{color:var(--cinza);font-size:10px;white-space:nowrap}
.diz-txt{padding-left:10px;overflow-wrap:anywhere}
.diz-txt .at-time{font-size:10px;color:var(--link);margin-left:5px;cursor:pointer}
.chat-vazio{color:var(--cinza);padding:6px 0}
.chat-envio{
  display:flex;
  gap:6px;
  margin-top:8px;
  padding-top:10px;
  border-top:1px solid var(--regra);
}
.msg-field{
  flex:1;
  min-width:0;
  font:11px/1.4 var(--fonte);
  color:var(--texto);
  background:#FFFDF7;
  border:1px solid var(--campo);
  border-radius:0;
  padding:3px 4px;
}
.msg-field:focus{outline:1px solid var(--link);outline-offset:-1px}
.msg-field.nome{flex:0 0 118px}

/* ---------- o rodapé ---------- */
.rodape{
  margin:0 0 clamp(10px,3vw,40px);border-bottom:1px solid var(--moldura);
  padding-left:max(16px,calc((100% - 1080px)/2 + 26px));padding-right:max(16px,calc((100% - 1080px)/2 + 26px));
  padding-top:18px;padding-bottom:30px;
  border-top:1px solid var(--regra);
  display:flex;justify-content:space-between;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;
  color:var(--cinza);
}
.rodape p{margin:0}
.rodape .assina{flex-direction:row;margin:0}
.rodape .assina .msg-field{width:170px;flex:none}
.rodape span{white-space:nowrap}
/* selinhos 88x31, como os botões dos sites de 2005 */
.selos{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 12px}
.selo{
  width:88px;height:31px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  font:bold 9px/1.05 var(--fonte);
  border:1px solid #000;
  text-transform:uppercase;
}
.selo.s1{background:var(--vermelho);color:var(--faixa)}
.selo.s2{background:var(--texto);color:var(--faixa)}
.selo.s3{background:var(--ceu);color:var(--texto)}
.selo.s4{background:var(--faixa);color:var(--texto)}
a.selo:hover{text-decoration:none;outline:2px solid var(--texto);outline-offset:-2px}

/* em tela estreita a lateral desce pro fim */
@media (max-width:700px){
  .corpo{display:block}
}
@media (max-width:760px){
  .corpo > main{display:block;padding:0 14px}
  .coluna{position:static;border-top:1px solid var(--regra)}
  #feed .item,#post .item{grid-template-columns:minmax(0,1fr) 96px;column-gap:14px}
}
@media (max-width:480px){
  .bloco,.leitura,.voltar{padding-left:12px;padding-right:12px}
  body{padding:0 8px;font-size:12px}
  .tv-palco{padding:16px 12px 14px}
  .cabeca{padding:12px 12px 8px}
  .status{padding:7px 12px 8px}
  .foto{padding:12px 12px 0}
  .legenda,.comentarios,.rodape{padding-left:12px;padding-right:12px}
  .chat-envio,.tv-recado{flex-wrap:wrap}
  .msg-field.nome{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  .no-ar::before{animation:none}
}
</style>

<body>
<div class="pagina">

  <header class="cabeca">
    <a class="marca" href="/" aria-label="Lagosta Filmes">
      <img src="logo-lagosta-filmes-tight.png" alt="Lagosta Filmes" width="336" height="158">
    </a>
  </header>



  <div class="corpo">
  <main>
    <!-- lagosta tv: canal 24/7, o palco da home (só aparece quando houver programação) -->
    <section class="tv-palco" id="tvCanto" aria-label="lagosta tv" hidden>
      <div class="tv" id="tvTela">
        <img class="tv-marca" src="lagosta-cheia.svg" alt="" aria-hidden="true">
        <button class="tv-som" id="tvSom" type="button" aria-label="ligar o som" hidden>🔇</button>
        <video id="tvVideo" muted playsinline preload="metadata" hidden></video>
        <!-- a tela das sessões, por cima: só aparece quando o vídeo já tem imagem (até lá a programação segue embaixo) -->
        <video class="tv-sessao espera" id="tvSessao" muted playsinline preload="auto"></video>
        <div class="tv-yt" id="tvYt" hidden></div>
        <div class="sem-sinal" id="tvSemSinal"><span>sem sinal</span></div>
        <!-- os recados da sessão passam aqui, no ponto em que foram deixados -->
        <div class="tv-recados" id="tvRecados" aria-live="polite"></div>
      </div>
      <div class="tv-barra">
        <span class="tv-agora" id="tvAgora" aria-live="polite"></span>
        <span class="tv-botoes">
          <span class="tv-vendo" id="tvVendo" hidden></span>
          <button class="tv-botao" id="tvCheia" type="button">tela cheia</button>
        </span>
      </div>
      <!-- recado na sessão (só aparece durante uma sessão): fica preso no ponto dela, como os comentários do rádio -->
      <form class="tv-recado" id="tvRecadoForm" hidden>
        <input class="msg-field nome" id="tvNick" type="text" maxlength="24" placeholder="nome" autocomplete="nickname" aria-label="seu nome">
        <input class="msg-field" id="tvRecado" type="text" maxlength="180" placeholder="recado na sessão" autocomplete="off" aria-label="recado na sessão">
        <button class="botao" type="submit">enviar</button>
      </form>
    </section>
    <!-- o feed: todos os posts, do mais novo pro mais velho (preenchido pelo script) -->
    <section id="feed" aria-label="posts"></section>

    <!-- a coluna: quem é, e a inscrição na newsletter -->
    <aside class="coluna">
      <h2 class="coluna-nome">lagosta filmes</h2>
      <p>produtora de filmes e outras coisas. fortaleza, ce.</p>
      <form class="assina" id="assinaForm" method="post" target="_blank">
        <label class="assina-nome" for="assinaEmail">newsletter aos sábados</label>
        <input class="msg-field" id="assinaEmail" type="email" name="email" placeholder="seu e-mail" required>
        <button class="inscrever" type="submit">se inscrever</button>
      </form>
      <p class="obs" id="assinaAviso" hidden>(ainda não ligado a um serviço de newsletter)</p>
      <p><a href="#newsletter">newsletters anteriores</a></p>
      <p><a href="mailto:oi.lagostafilmes@gmail.com">oi.lagostafilmes@gmail.com</a></p>
    </aside>

    <!-- um post aberto sozinho (lagostafilmes.com/#id); textos abrem em modo leitura -->
    <article id="post" hidden>
      <div class="voltar"><a href="#">← início</a></div>
      <div id="postCorpo"></div>
    </article>

    <!-- o player e os recados do piloto: o script põe os dois dentro do post do episódio -->
    <section class="radio" id="radio" aria-label="lagosta fm">
      <!-- a cena: o vídeo do obs, mudo (só no episódio aberto); com a câmera crua, os cantos são refeitos aqui -->
      <div class="cena" id="cena" hidden>
        <div class="cena-camera" id="cenaCamera"></div>
        <span class="cena-marca">lagosta fm</span>
        <button class="cena-setlist" id="cenaSetlist" type="button" aria-label="ver a setlist" hidden><img alt="a setlist, escrita à mão"></button>
        <a class="cena-janela" id="cenaJanela" href="#" aria-label="lagosta tv" hidden><video muted playsinline aria-hidden="true"></video></a>
        <button class="cena-faixa" id="cenaFaixa" type="button" hidden></button>
      </div>
      <div class="radio-linha">
        <!-- o anel do intervalo: texto em volta do play, gira enquanto toca -->
        <div class="anel-play">
          <svg class="anel" viewBox="0 0 100 100" aria-hidden="true">
            <defs><path id="anelCirc" d="M50,50 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0"/></defs>
            <text><textPath href="#anelCirc" id="anelTexto" textLength="250" lengthAdjust="spacing"></textPath></text>
          </svg>
          <button id="playBtn" class="play" type="button" aria-label="tocar">▶</button>
        </div>
        <div class="barra" id="progressBar" role="slider" aria-label="posição do episódio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="progress-bar-fill" id="progressFill"></div>
          <div class="marker-bubble" id="markerBubble"></div>
        </div>
        <span class="tempos"><span id="currentTime">00:00</span> / <span id="totalTime">--:--</span></span>
      </div>
      <!-- a tracklist (do post.txt): clicar numa faixa pula pra ela -->
      <ol class="faixas" id="faixas" hidden></ol>
      <!-- o widget do mixcloud, quando o episódio estiver lá -->
      <div class="mixcloud" id="mixcloudCaixa" hidden></div>
    <!-- áudio (Firebase Storage); o endereço vem do post -->
    <audio id="audioPlayer" preload="metadata"></audio>
    </section>
    <details class="comentarios" id="comentarios">
      <summary class="comentarios-cab"><b>comentários</b> <span class="quantos" id="recadosCount2"></span></summary>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <div class="chat-envio">
        <input id="nickInput" class="msg-field nome" type="text" maxlength="24" placeholder="nome" autocomplete="nickname" aria-label="seu nome">
        <input id="chatInput" class="msg-field" type="text" maxlength="180" placeholder="comentário" autocomplete="off" aria-label="comentário">
        <button id="sendBtn" class="botao" type="button">enviar</button>
      </div>
    </details>
  </main>

  <!-- a lateral: a produtora, como a coluna de perfil dos fotologs -->
  </div>

</div>

<!-- SDK Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
/* =========================================================
  NOME (campo do formulário; fica guardado no navegador)
  ========================================================= */
const NICK_KEY = "lagostaNick_v1";
const nickInput = document.getElementById("nickInput");

function loadNick(){
try{
const n = localStorage.getItem(NICK_KEY);
return n || "";
}catch(e){
return "";
}
}
function saveNick(nick){
try{
localStorage.setItem(NICK_KEY, nick);
}catch(e){}
}

let myNick = loadNick();
if(myNick && !/^OUVINTE_\d+$/i.test(myNick)) nickInput.value = myNick;

// o nome que vai no comentário: o do campo; vazio, vira ouvinte_123 (e fica)
function nomeAtual(){
const digitado = nickInput.value.trim();
if(digitado){ myNick = digitado; saveNick(myNick); return myNick; }
if(!myNick){ myNick = "ouvinte_" + Math.floor(Math.random()*1000); saveNick(myNick); }
return myNick;
}
nickInput.addEventListener("keydown",e=>{
if(e.key==="Enter"){ e.preventDefault(); chatInputEl.focus(); }
});

/* =========================================================
  PLAYER / TIMECODE
  Um player só pra todos os episódios: ele mora dentro do episódio
  que está tocando (ou do mais novo). O som vem de um arquivo
  (audio: Firebase Storage) ou do Mixcloud (mixcloud: o endereço do show).
  ========================================================= */
const audioEl       = document.getElementById("audioPlayer");
const playBtn       = document.getElementById("playBtn");
const progressFill  = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const totalTimeEl   = document.getElementById("totalTime");
const progressBar   = document.getElementById("progressBar");
const markerBubble  = document.getElementById("markerBubble");
const radioEl       = document.getElementById("radio");
const anelTexto     = document.getElementById("anelTexto");
const faixasEl      = document.getElementById("faixas");
const mixcloudCaixa = document.getElementById("mixcloudCaixa");

// a onda: barrinhas de alturas variadas (desenho fixo, não é o áudio de verdade)
const onda = document.createElement("div");
onda.className = "onda";
const N_BARRAS = 110;
for(let i=0;i<N_BARRAS;i++){
const b = document.createElement("i");
const h = 0.35 + 0.35*Math.abs(Math.sin(i*0.37)) + 0.3*Math.abs(Math.sin(i*1.91+1));
b.style.height = Math.round(Math.min(1,h)*100) + "%";
onda.appendChild(b);
}
progressBar.prepend(onda);
function pintarOnda(pct){
const ate = Math.floor(pct/100*N_BARRAS);
onda.childNodes.forEach((b,i)=>b.classList.toggle("tocou", i < ate));
}

function formatTime(sec){
if(isNaN(sec)) return "--:--";
sec = Math.max(0, sec);
const h = Math.floor(sec/3600);
const m = Math.floor(sec%3600/60);
const s = Math.floor(sec%60);
const mm = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
return h ? h+":"+mm : mm;
}
// "01:02:03" ou "02:03" → segundos
function segundos(txt){
return String(txt).split(":").reduce((acc,n)=>acc*60 + (parseFloat(n)||0), 0);
}

// o som: a mesma conversa pro arquivo e pro mixcloud
const som = {
modo: "audio",     // "audio" ou "mixcloud"
ep: null,          // o post do episódio que está no player
t: 0, dur: 0,
tocando: false,
mc: null,          // o widget do mixcloud, quando houver
tocar(){
if(this.modo === "mixcloud"){ if(this.mc) this.mc.play(); }
else audioEl.play().catch(()=>{});
},
pausar(){
if(this.modo === "mixcloud"){ if(this.mc) this.mc.pause(); }
else audioEl.pause();
},
alternar(){ this.tocando ? this.pausar() : this.tocar(); },
ir(t){
if(!this.dur) return;
t = Math.max(0, Math.min(this.dur - 0.5, t));
this.t = t;
if(this.modo === "mixcloud"){ if(this.mc) this.mc.seek(t); }
else audioEl.currentTime = t;
aoTempo();
}
};

playBtn.addEventListener("click", ()=> som.alternar());

/* --- o anel: texto em volta do play, gira enquanto toca (vem do intervalo do obs) --- */
function textoDoAnel(p){
const nome = p.titulo ? p.titulo.toLowerCase() : dataPonto(p.data);
const um = `lagosta fm · ${nome} · `;
return um + um;
}
function dataPonto(s){
const [a,m,d] = String(s||"").split("-");
return (a && m && d) ? `${d}.${m}.${a}` : "";
}

/* --- a cor do fundo: troca quando muda a faixa (como o anel batendo na borda) --- */
const CORES = ["c-ceu","c-faixa","c-campo"];
let faixas = [];     // [{t, nome, li}]
let faixaAtual = -1;
function montarFaixas(p){
faixasEl.innerHTML = "";
faixas = (p.faixas || []).map(linha=>{
// a linha vem do post.txt: "00:12:34  artista - faixa"
const m = String(linha).match(/^\s*([\d:]+)\s+(.*)$/);
const t = m ? segundos(m[1]) : 0;
const nome = m ? m[2] : String(linha);
const li = document.createElement("li");
const quando = document.createElement("span");
quando.className = "quando"; quando.textContent = formatTime(t);
li.append(quando, document.createTextNode(" " + nome));
li.title = "ouvir dessa faixa";
li.addEventListener("click", ()=>{ som.ir(t); if(!som.tocando) som.tocar(); });
faixasEl.append(li);
return {t, nome, li};
});
faixasEl.hidden = !faixas.length;
faixaAtual = -1;
pintarCor();
}
function pintarCor(){
const i = Math.max(0, faixaAtual);
CORES.forEach((c,k)=> radioEl.classList.toggle(c, k === i % CORES.length));
}
function conferirFaixa(){
let i = -1;
faixas.forEach((f,k)=>{ if(som.t >= f.t) i = k; });
if(i === faixaAtual) return;
faixaAtual = i;
faixas.forEach((f,k)=> f.li.classList.toggle("agora", k === i));
pintarCor();
cenaTexto();
}

/* --- o que acontece a cada passo do som --- */
function aoTempo(){
if(alvo !== null && som.modo === "audio") return;   // ainda indo pro ponto escolhido
currentTimeEl.textContent = formatTime(som.t);
if(som.dur > 0){
totalTimeEl.textContent = formatTime(som.dur);
const pct = (som.t/som.dur)*100;
progressFill.style.width = pct+"%";
pintarOnda(pct);
progressBar.setAttribute("aria-valuenow", Math.round(pct));
}
conferirFaixa();
passarRecados();
cenaTempo();
}
function aoEstado(){
playBtn.textContent = som.tocando ? "❚❚" : "▶";
playBtn.setAttribute("aria-label", som.tocando ? "pausar" : "tocar");
radioEl.classList.toggle("tocando", som.tocando);
if(som.tocando) calarTv();
if(window.tvAvisar) window.tvAvisar();
cenaSeguir(true);
}

/* --- o arquivo (firebase storage) --- */
// a duração às vezes só chega depois (e o safari às vezes dá "infinito" no começo)
function duracaoAudio(){
if(isFinite(audioEl.duration) && audioEl.duration > 0) return audioEl.duration;
try{ if(audioEl.seekable.length) return audioEl.seekable.end(audioEl.seekable.length-1); }catch(e){}
return 0;
}
function audioMudou(){
if(som.modo !== "audio") return;
som.t = audioEl.currentTime || 0;
const d = duracaoAudio();
if(d && d !== som.dur){ som.dur = d; renderMarkers(); }
aoTempo();
}
["timeupdate","loadedmetadata","durationchange"].forEach(ev=> audioEl.addEventListener(ev, audioMudou));
audioEl.addEventListener("play", ()=>{ if(som.modo==="audio"){ som.tocando = true; aoEstado(); } });
audioEl.addEventListener("pause", ()=>{ if(som.modo==="audio"){ som.tocando = false; aoEstado(); } });
audioEl.addEventListener("ended", ()=>{ som.tocando = false; aoEstado(); });

/* --- o mixcloud: o widget deles toca (e cuida da licença), o nosso botão manda --- */
let mixcloudApi = null;
function carregarMixcloudApi(){
if(!mixcloudApi) mixcloudApi = new Promise((ok, erro)=>{
const s = document.createElement("script");
s.src = "https://widget.mixcloud.com/media/js/widgetApi.js";
s.onload = ()=> ok(window.Mixcloud);
s.onerror = erro;
document.head.append(s);
});
return mixcloudApi;
}
function montarMixcloud(caminho, tocarJa){
mixcloudCaixa.innerHTML = "";
mixcloudCaixa.hidden = false;
const f = document.createElement("iframe");
// direto no player-widget (o endereço www redireciona e a api não conversa)
f.src = `https://player-widget.mixcloud.com/widget/iframe/?feed=${encodeURIComponent(caminho)}&hide_cover=1&mini=1&light=1&hide_artwork=1`;
f.title = "mixcloud";
f.allow = "encrypted-media; autoplay";
const carregou = new Promise(ok=> f.addEventListener("load", ok, {once:true}));
mixcloudCaixa.append(f);
som.mc = null;
radioEl.classList.remove("so-mixcloud");
// o widget só acorda quando aparece na tela. se, à vista, ele não conversar com a gente em 10 s,
// toca sozinho (o nosso botão sai de cena); se ele responder depois, o botão volta
const vigia = new IntersectionObserver(([e])=>{
if(!e.isIntersecting) return;
vigia.disconnect();
setTimeout(()=>{
if(mixcloudCaixa.contains(f) && !som.mc) radioEl.classList.add("so-mixcloud");
}, 10000);
});
vigia.observe(f);
// a api só conversa com o widget depois que ele abriu
Promise.all([carregarMixcloudApi(), carregou]).then(([Mixcloud])=>{
const w = Mixcloud.PlayerWidget(f);
w.ready.then(()=>{
if(!mixcloudCaixa.contains(f) || som.modo !== "mixcloud") return;   // já trocou de episódio
som.mc = w;
radioEl.classList.remove("so-mixcloud");
w.events.progress.on((pos, dur)=>{
som.t = pos || 0;
if(dur && dur !== som.dur){ som.dur = dur; renderMarkers(); }
aoTempo();
});
w.events.play.on(()=>{ som.tocando = true; aoEstado(); });
w.events.pause.on(()=>{ som.tocando = false; aoEstado(); });
w.events.ended.on(()=>{ som.tocando = false; aoEstado(); });
w.getDuration().then(d=>{ if(d){ som.dur = d; aoTempo(); renderMarkers(); } });
if(tocarJa) w.play();
});
}).catch(()=>{ mixcloudCaixa.textContent = "o mixcloud não carregou."; });
}

// põe um episódio no player (tocarJa: começa a tocar)
function carregarEpisodio(p, tocarJa){
if(som.ep === p){ if(tocarJa && !som.tocando) som.tocar(); return; }
som.pausar();
som.ep = p; som.t = 0; som.dur = 0; som.tocando = false; som.mc = null;
aoEstado();
anelTexto.textContent = textoDoAnel(p);
currentTimeEl.textContent = "00:00"; totalTimeEl.textContent = "--:--"; pintarOnda(0);
montarFaixas(p);
montarCena(p);
if(p.mixcloud){
som.modo = "mixcloud";
audioEl.removeAttribute("src"); audioEl.load();
montarMixcloud(p.mixcloud, tocarJa);
}else{
som.modo = "audio";
mixcloudCaixa.innerHTML = ""; mixcloudCaixa.hidden = true;
radioEl.classList.remove("so-mixcloud");
if(audioEl.getAttribute("src") !== p.audio){ audioEl.src = p.audio || ""; audioEl.load(); }
if(tocarJa) som.tocar();
}
mostrarRecados();
}

// clicar ou arrastar na onda: pula pro ponto (e começa a tocar, como no soundcloud)
let alvo = null;   // pra onde o usuário mandou ir, enquanto o áudio ainda está chegando lá
function irPara(ratio){
if(!som.dur) return;
ratio = Math.max(0, Math.min(1, ratio));
if(som.modo === "audio"){
alvo = ratio * som.dur;
// mostra na hora, sem esperar o áudio carregar
pintarOnda(ratio*100);
currentTimeEl.textContent = formatTime(alvo);
progressBar.classList.add("buscando");
audioEl.currentTime = alvo;
}else som.ir(ratio * som.dur);
}
audioEl.addEventListener("seeked", ()=>{ alvo = null; progressBar.classList.remove("buscando"); audioMudou(); });
function ratioDoPonteiro(e){
const r = progressBar.getBoundingClientRect();
return (e.clientX - r.left) / r.width;
}
progressBar.addEventListener("pointerdown", e=>{
if(e.button !== 0) return;
e.preventDefault();
progressBar.setPointerCapture(e.pointerId);
irPara(ratioDoPonteiro(e));
const mover = ev=> irPara(ratioDoPonteiro(ev));
const soltar = ()=>{
progressBar.removeEventListener("pointermove", mover);
progressBar.removeEventListener("pointerup", soltar);
progressBar.removeEventListener("pointercancel", soltar);
if(!som.tocando) som.tocar();
};
progressBar.addEventListener("pointermove", mover);
progressBar.addEventListener("pointerup", soltar);
progressBar.addEventListener("pointercancel", soltar);
});
// setas: pular 10 s
progressBar.addEventListener("keydown",(e)=>{
if(!som.dur) return;
const agora = alvo ?? som.t;
if(e.key==="ArrowRight"){ e.preventDefault(); irPara((agora+10)/som.dur); }
if(e.key==="ArrowLeft"){ e.preventDefault(); irPara((agora-10)/som.dur); }
});

/* =========================================================
  A CENA (a câmera do canto, como no obs)
  No episódio aberto, se o post tiver video: o vídeo mudo segue o som.
  video é o id de um vídeo não listado no YouTube (sem áudio, pra não ter
  problema de direitos) ou um .mp4. Normalmente é a gravação do obs, que já
  traz os cantos desenhados (nome, setlist, janelinha da tv, faixa tocando).
  Só com cru: true (a câmera sem nada por cima) os cantos são refeitos aqui:
  o nome, a setlist (setlist: a foto), a janelinha com a lagosta tv ao vivo
  e a faixa tocando.
  ========================================================= */
const cenaEl      = document.getElementById("cena");
const cenaCamera  = document.getElementById("cenaCamera");
const cenaSetlist = document.getElementById("cenaSetlist");
const cenaJanela  = document.getElementById("cenaJanela");
const cenaFaixa   = document.getElementById("cenaFaixa");
let camera = null;        // {tocar, pausar, tempo, ir, dur}
let cenaVisivel = false;
let cenaCrua = false;     // true: os cantos são desenhados aqui
let ultimaSeguida = 0;

function montarCena(p){
cenaCamera.innerHTML = ""; camera = null;
cenaSetlist.classList.remove("aberta");
if(!p.video){ mostrarCena(false); return; }
cenaCrua = !!p.cru;
cenaEl.classList.toggle("gravada", !cenaCrua);
const img = cenaSetlist.querySelector("img");
if(p.setlist){ img.src = p.setlist; cenaSetlist.hidden = false; }
else{ img.removeAttribute("src"); cenaSetlist.hidden = true; }
camera = /\.mp4($|\?)/.test(p.video) ? cameraMp4(p.video) : cameraYoutube(p.video);
cenaTexto();
}

// um mp4 (no teste, um clipe da tv; dá a volta se for mais curto que o som)
function cameraMp4(src){
const v = document.createElement("video");
v.src = src; v.muted = true; v.playsInline = true; v.loop = true; v.preload = "metadata";
cenaCamera.append(v);
return {
tocar(){ v.play().catch(()=>{}); },
pausar(){ v.pause(); },
tempo(){ return v.currentTime; },
ir(t){ v.currentTime = t; },
dur(){ return isFinite(v.duration) ? v.duration : 0; }
};
}

// um vídeo do youtube, mudo e sem controles: quem manda é o som
let youtubeApi = null;
function carregarYoutubeApi(){
if(!youtubeApi) youtubeApi = new Promise(ok=>{
const antes = window.onYouTubeIframeAPIReady;
window.onYouTubeIframeAPIReady = ()=>{ if(antes) antes(); ok(window.YT); };
const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.append(s);
});
return youtubeApi;
}
function cameraYoutube(id){
const caixa = document.createElement("div");
cenaCamera.append(caixa);
const cam = {
p: null, pronto: false,
tocar(){ if(this.pronto) this.p.playVideo(); },
pausar(){ if(this.pronto) this.p.pauseVideo(); },
tempo(){ return this.pronto ? this.p.getCurrentTime() : 0; },
ir(t){ if(this.pronto) this.p.seekTo(t, true); },
dur(){ return this.pronto ? this.p.getDuration() : 0; }
};
carregarYoutubeApi().then(YT=>{
if(!cenaCamera.contains(caixa)) return;   // já trocou de episódio
cam.p = new YT.Player(caixa, {
videoId: id,
host: "https://www.youtube-nocookie.com",
playerVars: {mute:1, controls:0, disablekb:1, playsinline:1, rel:0, iv_load_policy:3, fs:0},
events: {onReady(e){ e.target.mute(); cam.pronto = true; cenaSeguir(true); }}
});
});
return cam;
}

// a câmera vai atrás do som: toca junto, pausa junto, e corrige se escorregar mais de 1,5 s
function cenaSeguir(forcar){
if(!camera) return;
if(!cenaVisivel || !som.tocando){ camera.pausar(); return; }
const d = camera.dur();
const alvo = d ? som.t % d : som.t;
if(forcar || Math.abs(camera.tempo() - alvo) > 1.5) camera.ir(alvo);
camera.tocar();
}
// chamada a cada passo do som; confere a cada 2 s
function cenaTempo(){
if(!cenaVisivel || Date.now() - ultimaSeguida < 2000) return;
ultimaSeguida = Date.now();
cenaSeguir(false);
}

// a faixa tocando, no canto de baixo; clicar mostra ela na tracklist
function cenaTexto(){
const f = faixas[faixaAtual];
cenaFaixa.textContent = f ? f.nome : "";
cenaFaixa.hidden = !f;
}
cenaFaixa.addEventListener("click", ()=>{
const f = faixas[faixaAtual];
if(f) f.li.scrollIntoView({block:"nearest", behavior:"smooth"});
});
cenaSetlist.addEventListener("click", ()=> cenaSetlist.classList.toggle("aberta"));

// a janelinha: espelha o canal da lagosta tv (o mesmo clipe, no mesmo segundo)
const janelaVideo = cenaJanela.querySelector("video");
let timerJanela = null;
function janela(ligar){
clearInterval(timerJanela);
cenaJanela.hidden = true;
if(!ligar){ janelaVideo.pause(); return; }
// a tv liga depois da rádio (e some sem programação): confere a cada vez
const espelhar = ()=>{
const tv = document.getElementById("tvVideo");
const temTv = tv && !document.getElementById("tvCanto").hidden && tv.currentSrc;
cenaJanela.hidden = !temTv;
if(!temTv) return;
if(janelaVideo.src !== tv.currentSrc) janelaVideo.src = tv.currentSrc;
if(Math.abs(janelaVideo.currentTime - tv.currentTime) > 1.5) janelaVideo.currentTime = tv.currentTime;
janelaVideo.play().catch(()=>{});
};
espelhar();
timerJanela = setInterval(espelhar, 2000);
}

// a cena só aparece no episódio aberto que tem vídeo
function mostrarCena(ver){
cenaVisivel = !!(ver && camera);
cenaEl.hidden = !cenaVisivel;
janela(cenaVisivel && cenaCrua);
cenaSeguir(true);
}

/* =========================================================
  COMENTÁRIOS (local + timecode)
  Cada recado sabe de que episódio é (campo ep). Os do piloto,
  de antes de existir mais de um episódio, não têm ep.
  ========================================================= */
const chatLogEl   = document.getElementById("chatLog");
const chatInputEl = document.getElementById("chatInput");
const sendBtn     = document.getElementById("sendBtn");
const contadores  = ["recadosCount","recadosCount2"].map(id=>document.getElementById(id));

const STORAGE_KEY = "lagostaChatMessages_v1";
const PILOTO = "lagosta-fm-piloto";

function loadLocalMessages(){
try{
const raw = localStorage.getItem(STORAGE_KEY);
if(!raw) return [];
return JSON.parse(raw);
}catch(e){
return [];
}
}
function saveLocalMessages(msgs){
try{
localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
}catch(e){}
}

function escapeHtml(str){
return String(str).replace(/[&<>"']/g, s=>({
"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[s]));
}

// os recados do episódio que está no player
function recadosDoEp(){
const id = som.ep ? som.ep.id : PILOTO;
return messages.filter(m => (m.ep || PILOTO) === id);
}

function dataCurta(m){
const d = new Date(m.at);
const hh=String(m.atHour).padStart(2,"0");
const mm=String(m.atMin).padStart(2,"0");
if(isNaN(d.getTime())) return hh+":"+mm;
const dd=String(d.getDate()).padStart(2,"0");
const mo=String(d.getMonth()+1).padStart(2,"0");
return `${dd}/${mo}/${d.getFullYear()} ${hh}:${mm}`;
}

function renderChat(){
const msgs = recadosDoEp();
chatLogEl.innerHTML="";
if(contadores[0]) contadores[0].textContent = msgs.length;
if(contadores[1]) contadores[1].textContent = "(" + msgs.length + ")";
if(!msgs.length){
const v=document.createElement("div");
v.className="chat-vazio";
v.textContent="ninguém comentou ainda.";
chatLogEl.appendChild(v);
return;
}
msgs
.sort((a,b)=>a.at-b.at)
.forEach(m=>{
const el=document.createElement("div");
el.className="diz";
el.dataset.at = m.at;
el.innerHTML=`<div class="diz-cab"><span><span class="nick">${escapeHtml(m.nick || "ouvinte")}</span> diz:</span><span class="hora">${dataCurta(m)}</span></div><div class="diz-txt">${escapeHtml(m.text)}<span class="at-time" title="ouvir desse ponto" data-t="${Number(m.tAudio)||0}">@${formatTime(m.tAudio)}</span></div>`;
chatLogEl.appendChild(el);
});
chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

// clicar no @tempo de um comentário: pular pra esse ponto do episódio
chatLogEl.addEventListener("click",(e)=>{
const t = e.target.closest(".at-time");
if(!t) return;
const sec = parseFloat(t.dataset.t);
if(!isNaN(sec)){ som.ir(sec); if(!som.tocando) som.tocar(); }
});

function renderMarkers(){
progressBar.querySelectorAll(".comment-marker").forEach(o=>o.remove());
if(!som.dur) return;
recadosDoEp().forEach(m=>{
if(!(m.tAudio > 0.5)) return; // comentário deixado antes de dar play: fica na lista, sem marca na barra
const marker = document.createElement("div");
marker.className = "comment-marker";
marker.style.left = Math.min(100, (m.tAudio / som.dur) * 100) + "%";
marker.dataset.at = m.at;
marker.setAttribute("aria-label", `${formatTime(m.tAudio)} ${m.nick || ""}: ${m.text}`);
marker._msg = m;
progressBar.appendChild(marker);
});
}
function mostrarRecados(){ renderChat(); renderMarkers(); }

function showMarkerBubble(msg, markerEl){
const rect = progressBar.getBoundingClientRect();
const markerRect = markerEl.getBoundingClientRect();
markerBubble.style.display="block";
markerBubble.textContent = `${formatTime(msg.tAudio)} ${msg.nick ? msg.nick + " diz: " : ""}${msg.text}`;
let leftPos = markerRect.left - rect.left;
const maxLeft = Math.max(0, rect.width - 240);
markerBubble.style.left = Math.min(leftPos, maxLeft) + "px";
}
// passar o mouse num comentário: mostra onde ele cai na onda
function focarRecado(at){
progressBar.querySelectorAll(".agora").forEach(x=>x.classList.remove("agora"));
const mk = at ? progressBar.querySelector(`.comment-marker[data-at="${at}"]`) : null;
if(!mk){ hideMarkerBubble(); return; }
mk.classList.add("agora");
showMarkerBubble(mk._msg, mk);
}
chatLogEl.addEventListener("mouseover",e=>{
const d = e.target.closest(".diz");
if(d) focarRecado(d.dataset.at);
});
chatLogEl.addEventListener("mouseleave",()=>focarRecado(null));

// como no soundcloud: quando o som passa por um recado, ele aparece por uns segundos
let ultimoT = 0, timerRecado = null;
function passarRecados(){
const t = som.t;
if(t > ultimoT && t - ultimoT < 2){
const mk = [...progressBar.querySelectorAll(".comment-marker")]
.find(el => el._msg.tAudio > ultimoT && el._msg.tAudio <= t);
if(mk){
progressBar.querySelectorAll(".agora").forEach(x=>x.classList.remove("agora"));
mk.classList.add("agora");
showMarkerBubble(mk._msg, mk);
clearTimeout(timerRecado);
timerRecado = setTimeout(()=>{ mk.classList.remove("agora"); hideMarkerBubble(); }, 4000);
}
}
ultimoT = t;
}
function hideMarkerBubble(){
markerBubble.style.display="none";
}

/* cria e envia um comentário */
function addMessage(text){
if(!text.trim()) return;

const now    = new Date();
const newMsg = {
text: text.trim(),
tAudio: som.t || 0,
at: now.getTime(),
atHour: now.getHours(),
atMin: now.getMinutes(),
nick: nomeAtual()
};
// o piloto continua como sempre foi; os episódios novos dizem de quem é o recado
if(som.ep && som.ep.id !== PILOTO) newMsg.ep = som.ep.id;

messages.push(newMsg);
saveLocalMessages(messages);
sendToFirebase(newMsg);
mostrarRecados();
}

sendBtn.addEventListener("click",()=>{
const v = chatInputEl.value;
if(!v.trim()) return;
addMessage(v);
chatInputEl.value="";
chatInputEl.focus();
});
chatInputEl.addEventListener("keydown",e=>{
if(e.key==="Enter"){
e.preventDefault();
const v = chatInputEl.value;
if(!v.trim()) return;
addMessage(v);
chatInputEl.value="";
}
});

function firebasePushKey(){
const ref = firebaseDbRef.ref("messages");

function firebaseWriteMessage(msg,key){

ref.set(msg);

function sendToFirebase(msg){

);

}
});
}

/* =========================================================
  A GRADE DA TV (hora marcada, hora de fortaleza)
  O dia da lagosta tv tem dois pontos fixos; no resto, a programação normal
  (os trechos de TV_PROGRAMACAO, embaralhados).
  - 08:00 lagosta fm: o episódio mais novo que tem vídeo, o programa do café da manhã.
    a imagem é o vídeo mudo do episódio; o som (o botão de som da tv) é o player da rádio,
    no mesmo ponto. depois disso o episódio continua no post dele.
  - 21:00 a sessão da noite: o essential mix do nicolas jaar (bbc radio 1, 2012)
    com a colagem de filmes da lagosta filmes por cima.
    video: um .mp4 (o do jaar fica no archive.org: o youtube bloqueia a colagem por direitos) ou id do youtube. sem video, a sessão não entra.
    de: de quem é a obra, quando não é da casa (aparece do lado do nome: "essential mix, nicolas jaar").
    montagem: de quem é a montagem das imagens, quando a obra é de outro e a imagem é da casa.
    noite: true põe a sessão no rodízio da noite: uma por semana, na ordem da lista
    (a semana vira no sábado, junto com a newsletter). com uma só, é ela toda noite.
  - domingo, 19:00, a sessão de curtas: os curtas da casa, um atrás do outro.
    lista: "curtas" = todos os trechos dessa fonte em TV_PROGRAMACAO, na ordem da lista.
    dias: os dias da semana em que a sessão passa (0 = domingo … 6 = sábado); sem dias, todo dia.
  - de madrugada o canal dorme (TV_DORME): sai do ar, ficam as barras de "sem sinal", e volta sozinho.
    uma sessão que caia nesse horário passa mesmo assim.
  - aparições raras: todo trecho de fonte "raro" (arquivo raro-*.mp4, ou fonte "raro" no painel) fica fora
    do embaralho e passa uma única vez por semana, num instante sorteado, o mesmo pra todo mundo.
  Pra testar no seu mac: ?hora=20:59:40 no endereço põe o relógio da tv nessa hora.
  ========================================================= */
const TV_SESSOES = [
{id:"essential", hora:"21:00", noite:true, titulo:"essential mix", de:"nicolas jaar", montagem:"lagosta filmes", video:"https://archive.org/download/lagosta-essential-jaar/essential-jaar.mp4", duracao:7088.4},
{id:"curtas", hora:"19:00", dias:[0], titulo:"sessão de curtas", lista:"curtas"},
{id:"fm", hora:"08:00", titulo:"lagosta fm", ep:true}
];
const TV_DORME = ["02:00", "08:00"];   // o canal sai do ar entre essas horas
// no seu mac, a sessão da noite passa o arquivo local (fora do repo)
const TV_SESSOES_TESTE = {essential: ".claude/teste-tv/essential-jaar.mp4"};
// o episódio que passa na tv de manhã: o mais novo com vídeo
function epDaTv(){
const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
return POSTS.filter(p => p.tipo === "episodio" && p.video && !p.rascunho && (local || !p.teste))
.sort((a,b) => String(b.data).localeCompare(String(a.data)))[0] || null;
}

/* =========================================================
  POSTS (o feed, do mais novo pro mais velho)
  Pra postar: acrescente um objeto no topo da lista.
  - id: curto, sem espaço (vira o endereço: lagostafilmes.com/#ep-2)
  - tipo: "foto", "episodio", "texto", "nota" ou "indica"
      foto     → imagem com legenda
      episodio → rádio
      texto    → artigo: aparece a chamada no feed e abre em modo leitura
      nota     → texto curto, aparece inteiro no feed (como legenda de insta)
      indica   → uma indicação: link pra fora + o que você achou
      links    → uma lista curada (itens: titulo, link, fonte, nota)
      carta    → a newsletter da semana (abre em modo leitura; o arquivo fica em #newsletter)
  - data: "aaaa-mm-dd"
  - titulo; imagem (arquivo na raiz, opcional)
  - resumo: a frase que aparece no feed
  - texto: lista de parágrafos (texto puro, sem html)
  - link, fonte: só no "indica" (o endereço e de onde é)
  - só no "episodio" (cada episódio tem o próprio player e os próprios recados):
      audio:    o endereço do mp3 no Firebase Storage
      mixcloud: ou o endereço do show no Mixcloud, ex. "/lagostafilmes/20-11-2026/"
      faixas:   a tracklist, colada do post.txt (uma linha por faixa: "00:12:34  artista - faixa")
      duracao:  em segundos (a grade da tv precisa saber quando o programa acaba)
  - só na "carta":
      numero: o mesmo do episódio (newsletter 002 anda com o lagosta fm 002)
      ep:     o id do episódio da semana; ele ganha "na newsletter: …" e a newsletter ganha o player
      texto:  como no "texto"; cada "## " é um assunto (e um assunto do programa)
  - nos parágrafos, [palavras](https://…) vira link
  - rascunho: true esconde o post; ele só aparece com ?rascunho no endereço
  - teste: true só aparece no seu mac (localhost), nunca no site
  ========================================================= */
const POSTS = [
{
id: "lagosta-fm-piloto",
tipo: "episodio",
data: "2025-10-27",
audio: "https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-piloto.mp3?alt=media&token=ce87e2ff-d1e1-4e31-9c3d-2aeaa8a3fbde"
},

(function(){
const verRascunhos = new URLSearchParams(location.search).has("rascunho") || location.hostname === "localhost";  // no seu mac, os rascunhos sempre aparecem
const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
const posts = POSTS
.filter(p => (verRascunhos || !p.rascunho) && (local || !p.teste))
.sort((a,b) => String(b.data).localeCompare(String(a.data)));   // o mais novo em cima
const feed = document.getElementById("feed");
const postEl = document.getElementById("post");
const postCorpo = document.getElementById("postCorpo");
const recados = document.getElementById("comentarios");
const NOMES = {foto:"foto", episodio:"lagosta fm", texto:"texto", nota:"nota", indica:"indica", links:"links", carta:"newsletter"};
const cartas = posts.filter(p => p.tipo === "carta");
const nomeCarta = c => c.titulo || "newsletter " + String(c.numero || "").padStart(3,"0");
const assuntos = c => (c.texto || []).filter(t => t.startsWith("## ")).map(t => t.slice(3));
const cartaDoEp = ep => cartas.find(c => c.ep === ep.id);

function el(tag, cls, txt){
const e = document.createElement(tag);
if(cls) e.className = cls;
if(txt != null) e.textContent = txt;
return e;
}
function dataBr(s){
const [a,m,d] = String(s).split("-");
return (a && m && d) ? `${d}/${m}/${a}` : "";
}
function linkProPost(p, txt, cls){
const a = el("a", cls || null, txt);
a.href = "#" + p.id;
return a;
}
function cabecalho(p){
const linha = el("div","legenda-linha");
const esq = el("span");
esq.append(el("span","tipo t-"+p.tipo, NOMES[p.tipo] || p.tipo));
// episódio sem título (o normal): o nome é a data. com título (episódio temático), a data vai do lado
const dataComoNome = p.tipo === "episodio" && !p.titulo;
if(dataComoNome) esq.append(linkProPost(p, dataBr(p.data), "nome-data"));
else if(p.titulo && (p.tipo === "foto" || p.tipo === "episodio")) esq.append(el("b", null, p.titulo));
if(p.rascunho) esq.append(el("span","rascunho","rascunho"));
// a data é o link permanente do post
linha.append(esq);
if(!dataComoNome) linha.append(linkProPost(p, dataBr(p.data), "data"));
return linha;
}
function foto(p){
if(!p.imagem) return null;
const f = el("figure","foto");
f.style.margin = "0";
const img = el("img","imagem");
img.src = p.imagem; img.alt = p.alt || p.titulo || ""; img.loading = "lazy";
f.append(img);
return f;
}
// "## " no começo vira intertítulo; "> " vira citação; o resto é parágrafo
function paragrafos(lista, caixa){
(lista || []).forEach(par=>{
if(par.startsWith("## ")) caixa.append(el("h2", null, par.slice(3)));
else if(par.startsWith("> ")) caixa.append(comLinks(el("blockquote"), par.slice(2)));
else caixa.append(comLinks(el("p"), par));
});
}
// [palavras](https://…) vira link; o resto entra como texto puro
function comLinks(no, txt){
const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
let i = 0, m;
while((m = re.exec(txt))){
no.append(txt.slice(i, m.index));
const a = el("a", null, m[1]); a.href = m[2]; a.target = "_blank"; a.rel = "noopener";
no.append(a);
i = re.lastIndex;
}
no.append(txt.slice(i));
return no;
}

// um post no feed
function itemDoFeed(p){
const item = el("div","item");
// a miniatura à direita só existe quando o post tem imagem
if(p.imagem){
const mini = el("a","miniatura"); mini.href = "#" + p.id;
const im = el("img"); im.src = p.imagem; im.alt = p.alt || p.titulo || ""; im.loading = "lazy"; mini.append(im);
item.append(mini);
}else item.classList.add("sem-mini");
if(p.tipo === "foto" && p.imagem) item.classList.add("so-foto");   // a foto do dia aparece grande, não em miniatura
const leg = el("div","legenda");
leg.append(cabecalho(p));

if(p.tipo === "texto"){
leg.append(linkProPost(p, p.titulo, "titulo-texto"));
}
if(p.tipo === "carta"){
leg.append(linkProPost(p, nomeCarta(p), "titulo-texto"));
}
if(p.tipo === "indica"){
const a = el("a","titulo-texto", p.titulo + " ↗");
a.href = p.link; a.target = "_blank"; a.rel = "noopener";
leg.append(a);
if(p.fonte) leg.append(el("div","obs", p.fonte));
}
if(p.tipo === "links"){
leg.append(linkProPost(p, p.titulo, "titulo-texto"));
}
if(p.resumo) leg.append(el("p", null, p.resumo));
if(p.tipo === "links"){
const ol = el("ol","links");
(p.itens || []).forEach(it=>{
const li = el("li");
const a = el("a", null, it.titulo + " ↗");
a.href = it.link; a.target = "_blank"; a.rel = "noopener";
li.append(a);
if(it.fonte) li.append(el("span","obs"," " + it.fonte));
if(it.nota) li.append(el("div", null, it.nota));
ol.append(li);
});
leg.append(ol);
}
if(p.tipo === "nota" || p.tipo === "indica"){
const caixa = el("div","nota-txt");
paragrafos(p.texto, caixa);
leg.append(caixa);
}

const meta = el("div","meta");
if(p.tipo === "texto" || p.tipo === "carta"){
meta.append(linkProPost(p, "ler →", "ler"));
}
if(meta.childNodes.length) leg.append(meta);
// o episódio da semana passa na tv toda manhã
if(p.tipo === "episodio" && p === epDaTv()){
const fm = TV_SESSOES.find(x => x.ep);
leg.append(el("p","na-carta","na lagosta tv: todo dia às " + fm.hora + ", com imagem."));
}
// episódio com newsletter: os assuntos dela, que são os assuntos do programa
const carta = p.tipo === "episodio" && cartaDoEp(p);
if(carta){
const na = el("p","na-carta","na newsletter: ");
const lista = assuntos(carta);
na.append(lista.length ? lista.join(" · ") + " " : "", linkProPost(carta, nomeCarta(carta) + " →"));
leg.append(na);
}
// episódio: o player vem morar aqui quando é a vez dele; até lá, um "ouvir"
if(p.tipo === "episodio"){
leg.dataset.ep = p.id;
const b = el("button","ouvir");
b.type = "button";
b.append(el("span","ouvir-play","▶"), document.createTextNode(" ouvir"));
b.addEventListener("click", ()=>{ carregarEpisodio(p, true); moverRecados(); });
leg.append(b);
}
item.append(leg);
return item;
}

// muda o player de lugar sem reiniciar o som (moveBefore: chrome novo; nos outros, append, e o som pode parar)
function mudar(onde, ...nos){
nos.forEach(n=>{
if(n.parentNode === onde && n === onde.lastChild) return;
if(onde.moveBefore && n.isConnected) onde.moveBefore(n, null); else onde.append(n);
});
}

// o player e os recados moram dentro do episódio que está no player (o que estiver à vista)
function moverRecados(){
const caixa = postEl.hidden ? feed : postCorpo;
const radio = document.getElementById("radio");
const vis = som.ep ? caixa.querySelector(`[data-ep="${som.ep.id}"]`) : null;
if(vis){ mudar(vis, radio, recados); recados.hidden = false; radio.hidden = false; }
else{ recados.hidden = true; radio.hidden = true; }
// a câmera só no episódio aberto
mostrarCena(!!vis && !postEl.hidden);
// o "ouvir" some no episódio que já tem o player
caixa.querySelectorAll("[data-ep]").forEach(l=>{
const b = l.querySelector(".ouvir");
if(b) b.hidden = l === vis;
});
}

// um post aberto sozinho; texto em modo leitura
function abrir(p){
// o player pode estar morando aqui: tira antes de limpar, senão ele vai junto
mudar(postEl.parentNode, document.getElementById("radio"), recados);
postCorpo.innerHTML = "";
if(p.tipo === "texto" || p.tipo === "carta"){
const art = el("div","leitura");
art.append(cabecalho(p), el("h1", null, p.tipo === "carta" ? nomeCarta(p) : p.titulo));
if(p.resumo) art.append(el("p","data", p.resumo));
const prosa = el("div","prosa");
paragrafos(p.texto, prosa);
art.append(prosa);
postCorpo.append(art);
if(p.tipo === "carta"){
// o episódio da semana vem junto, com o player
const ep = posts.find(x => x.id === p.ep);
if(ep) postCorpo.append(itemDoFeed(ep));
const pe = el("div","carta-pe leitura");
const l1 = el("p"); l1.append(linkProPost({id:"newsletter"}, "newsletters anteriores"), " · ", linkProPost({id:""}, "o resto do site"));
pe.append(l1, el("p", null, "pra receber por e-mail, o campo é aqui do lado (ou lá embaixo, no celular)."));
postCorpo.append(pe);
}
}else{
postCorpo.append(itemDoFeed(p));
}
document.title = `${p.tipo === "carta" ? nomeCarta(p) : (p.titulo || dataBr(p.data) || NOMES[p.tipo])} · Lagosta Filmes`;
}

// o arquivo das newsletters (como o de um substack, só que uma lista)
function arquivoDeCartas(){
mudar(postEl.parentNode, document.getElementById("radio"), recados);
postCorpo.innerHTML = "";
const art = el("div","leitura");
art.append(el("h1", null, "newsletter"));
art.append(el("p","data", cartas.length ? "uma por semana, junto com o lagosta fm." : "nenhuma ainda."));
const ol = el("ol","cartas");
cartas.forEach(c=>{
const li = el("li");
li.append(el("span","num", dataBr(c.data)));
const d = el("div");
d.append(linkProPost(c, nomeCarta(c)));
const a = assuntos(c);
if(a.length) d.append(el("span","assuntos", a.join(" · ")));
li.append(d);
ol.append(li);
});
art.append(ol);
postCorpo.append(art);
document.title = "newsletter · Lagosta Filmes";
}

function mostrar(){
const id = decodeURIComponent(location.hash.slice(1));
const p = posts.find(x => x.id === id);
if(id === "newsletter" || id === "cartas"){
arquivoDeCartas();
feed.hidden = true; postEl.hidden = false;
window.scrollTo(0,0);
}else if(p){
abrir(p);
// abriu um episódio e nada está tocando: ele vai pro player
if(p.tipo === "episodio" && !som.tocando) carregarEpisodio(p, false);
// abriu uma newsletter: o episódio dela vai pro player (se nada estiver tocando)
const epDaCarta = p.tipo === "carta" && posts.find(x => x.id === p.ep);
if(epDaCarta && !som.tocando) carregarEpisodio(epDaCarta, false);
feed.hidden = true; postEl.hidden = false;
window.scrollTo(0,0);
}else{
feed.hidden = false; postEl.hidden = true;
document.title = "Lagosta Filmes";
}
moverRecados();
}

posts.forEach(p => feed.append(itemDoFeed(p)));
// de saída, o player fica no episódio mais novo
const maisNovo = posts.find(p => p.tipo === "episodio");
if(maisNovo) carregarEpisodio(maisNovo, false);

window.moverRecados = moverRecados;   // a tv usa, quando liga o som do lagosta fm
window.addEventListener("hashchange", mostrar);
mostrar();
})();
