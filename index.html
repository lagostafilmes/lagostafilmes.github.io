<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Lagosta Filmes</title>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#A5C7F9">

<style>
:root{
  --bg-blue:#A5C7F9;--line-dark:#000;--line-mid:rgba(0,0,0,.4);
  --box-bg:#fff;--fm-head:#7a0000;--fm-green:#00e060;--fm-black:#111;
  --mono:"Courier New",monospace;
  --bodyfont:"Comic Sans MS","Trebuchet MS",Arial,sans-serif;
  --serif:"Times New Roman",Times,serif;
}
body{margin:0;min-height:100vh;background:var(--bg-blue);font-family:var(--bodyfont);display:flex}
main{max-width:720px;width:100%;margin:auto;padding:16px;display:grid;row-gap:20px}
header{text-align:center}
header img{max-width:180px;margin-bottom:12px}
.poster-wrap{background:#fff;border:1px solid #000;padding:8px}
.poster-wrap img{width:100%}

.fm-block{background:#fff;border:1px solid #000;padding:12px;display:grid;row-gap:16px}
.fm-header{display:flex;justify-content:space-between}
.fm-title{font-weight:bold;color:#7a0000}
.fm-status{font-family:Courier New;font-size:11px;border:1px solid #7a0000;padding:2px 4px}

.player-box{border:1px solid #000;background:#f2f2f2;padding:10px;display:grid;row-gap:10px;font-family:Courier New;font-size:12px}
.player-row-top{display:flex;justify-content:space-between}
.play-btn{background:#7a0000;color:#fff;border:0;padding:6px 12px;cursor:pointer}

.progress-bar-bg{width:100%;height:6px;background:#d00;border:1px solid #000}
.progress-bar-fill{background:#fff;height:100%;width:0%}
.time-row{display:flex;justify-content:space-between;font-size:11px}
audio{display:none}

.chat-box{border:1px solid #000;background:#111;color:#00e060;font-family:Courier New;font-size:11px;padding:10px}
.chat-log{max-height:90px;overflow-y:auto;border:1px solid #00e060;padding:6px;background:#000}
.msg-field{width:100%;background:#000;color:#00e060;border:1px solid #00e060;padding:6px}
.msg-send-btn{background:#00e060;border:0;padding:6px}
footer{text-align:center;background:#fff;border:1px solid #000;padding:10px}
</style>
</head>

<body>
<main>

<header>
  <img src="logo-lagosta-filmes.png">
  <div class="poster-wrap">
    <img src="poster-fortown.png">
  </div>
</header>

<!-- EP 1 -->
<section class="fm-block">
  <div class="fm-header">
    <div class="fm-title">LAGOSTA FM</div>
    <div class="fm-status">ON AIR</div>
  </div>

  <div class="player-box">
    <div class="player-row-top">
      <div>EP PILOTO</div>
      <div>LAGOSTA FM</div>
    </div>

    <button id="playBtn" class="play-btn">PLAY</button>

    <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
    <div class="time-row"><span>00:00</span><span>--:--</span></div>

    <audio id="audioPlayer">
      <source src="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-piloto.mp3?alt=media&token=ce87e2ff-d1e1-4e31-9c3d-2aeaa8a3fbde" type="audio/mpeg">
    </audio>
  </div>

  <div class="chat-box">
    <div class="chat-log"></div>
    <input class="msg-field" placeholder="digite sua mensagem">
    <button class="msg-send-btn">ENVIAR</button>
  </div>
</section>

<!-- EP 2 -->
<section class="fm-block">
  <div class="fm-header">
    <div class="fm-title">LAGOSTA FM</div>
    <div class="fm-status">ON AIR</div>
  </div>

  <div class="player-box">
    <div class="player-row-top">
      <div>EP 02 — Pela vitória pelo triunfo</div>
      <div>LAGOSTA FM</div>
    </div>

    <button class="play-btn">PLAY</button>

    <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
    <div class="time-row"><span>00:00</span><span>--:--</span></div>

    <audio>
      <source src="https://firebasestorage.googleapis.com/v0/b/lagosta-fm.firebasestorage.app/o/ep-02.mp3?alt=media&token=c6ad1ade-f420-4c59-9b2a-01ff991669ad" type="audio/mpeg">
    </audio>
  </div>

  <div class="chat-box">
    <div class="chat-log"></div>
    <input class="msg-field" placeholder="digite sua mensagem">
    <button class="msg-send-btn">ENVIAR</button>
  </div>
</section>

<footer>
  <b>oi@lagostafilmes.com</b><br>
  insta: <b>@lagosta.filmes</b>
</footer>

</main>
</body>
</html>
